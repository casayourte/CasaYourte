<style>
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:.5rem}

details.grupo{border:1px solid var(--line);border-radius:var(--r-s);background:var(--ink2);
  margin-bottom:.5rem;overflow:hidden}
details.grupo>summary{padding:.75rem .85rem;cursor:pointer;display:flex;align-items:center;
  gap:.5rem;list-style:none}

  background:var(--ink3);padding:.08rem .28rem;border-radius:3px}

.filtros{display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:.8rem}

  font-family:var(--mono);font-size:.55rem;letter-spacing:.09em;text-transform:uppercase;
  padding:.3rem .55rem;border-radius:999px}

.cbarra{position:fixed;left:0;right:0;bottom:calc(var(--barra) + var(--safe));z-index:35;

<body>

<div id="nav"></div>

<div class="contenedor">

    cual, usá el ojo 👁 de la portada del panel. Acá están <b>todos</b> los textos,

  <!-- GALERÍA -->

</div>
<!-- BARRA DE CONTENIDO -->
<div class="cbarra hide" id="c-barra">
  <span class="cuenta" id="c-cuenta"></span>
  <button class="btn" id="c-recargar" aria-label="Recargar y comparar">↻</button>
  <button class="btn" id="c-guardar">Guardar</button>
  <button class="btn p" id="c-exportar">Exportar JSON</button>
</div>


<script type="module">
import { db, auth, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc,
         collection, serverTimestamp, onAuthStateChanged, signOut } from "./firebase-init.js";
import { CY } from "./nucleo.js";

CY.PANEL = "contenido-1";
CY.alSalir = () => { CY.usuario = null; signOut(auth).then(() => location.replace("./admin.html")); };

const yo = await CY.arrancar({ db, auth, doc, getDoc, onAuthStateChanged }, "contenido", "contenido");

const $ = (id) => document.getElementById(id);
const explicar = CY.explicar;
const toast = CY.aviso;
const puede = CY.puede;
const CLOUD = CY.CLOUDINARY.cloud;
const PRESET = CY.CLOUDINARY.preset;

/* ═════════════════════════════════════════════════════════════
   CONTENIDO DEL SITIO

   Se edita el mismo diccionario que consume index.html: las claves
   data-i, 130 por idioma. Se lee de sitio/borrador, y si no existe de
   sitio/publicado, y si tampoco de contenido.json.

   Guardar escribe el BORRADOR. Publicar copia el borrador a
   sitio/publicado, que es lo que lee el visitante, y sólo puede
   hacerlo un admin.

   Dos reglas que hay que respetar acá:
   · Los valores que no son texto van como "json:" + JSON, porque
     Firestore no admite arrays dentro de arrays (§3.19).
   · El mapa se escribe COMPLETO con setDoc, nunca con updateDoc de una
     clave punteada: los puntos de hero.t1 se leerían como ruta (§3.20).
   ═════════════════════════════════════════════════════════════ */

// Los 20 lugares de imagen del sitio, en el orden en que aparecen.
const SLOTS = ["hero","traj1","traj2","traj3","traj4","traj5",
  "dif1","dif2","dif3","dif4","dif5","dif6","dif7","dif8",
  "int1","int2","int3","co","ws",
  // Los doce fotogramas del cuadro del proceso: faltaban y no se podían cambiar.
  "p01","p02","p03","p04","p05","p06","p07","p08","p09","p10","p11","p12"];

// Grupos, en el orden de la página. El prefijo agrupa las claves.
const GRUPOS = [
  { t: "Portada",            pre: ["hero","cap"] },
  { t: "La idea",            pre: ["id"] },
  { t: "El proceso",         pre: ["pr"] },
  { t: "Trayectoria",        pre: ["traj","s1","s2","s3","s4","s5"] },
  { t: "Diferencial técnico",pre: ["dif","d1","d2","d3","d4","d5","d6","d7","d8"] },
  { t: "El interior",        pre: ["in"] },
  { t: "Qué ofrecemos",      pre: ["of","o1","o2","o3","o4"] },
  { t: "Co-construcción",    pre: ["co"] },
  { t: "Taller y ficha",     pre: ["ws","ficha"] },
  { t: "Invitación al álbum", pre: ["al"] },
  { t: "Página de álbumes",   pre: ["alb"] },
  { t: "Contacto",           pre: ["ct"] },
];

// Etiqueta legible a partir del sufijo de la clave.
const SUF = {
  eyebrow:"Antetítulo", title:"Título", lede:"Entrada", t:"Título", b:"Texto",
  s:"Etiqueta técnica", n:"Número de línea", g:"Nota al pie", l:"Lista de puntos",
  yr:"Época", quote:"Frase destacada", note:"Nota al pie", rows:"Filas de la tabla",
  wa:"Botón de WhatsApp", k:"Etiqueta", v:"Valor",
};
function etiqueta(clave) {
  const suf = clave.split(".")[1] || clave;
  if (SUF[suf]) return SUF[suf];
  let m = suf.match(/^c(\d+)$/);   if (m) return "Leyenda " + m[1];
  m = suf.match(/^b(\d+)$/);       if (m) return "Párrafo " + m[1];
  m = suf.match(/^k(\d+)$/);       if (m) return "Etiqueta " + m[1];
  m = suf.match(/^v(\d+)$/);       if (m) return "Valor " + m[1];
  m = suf.match(/^h(\d+)$/);       if (m) return "Encabezado " + m[1];
  return suf;
}

let CONT = null;        // { es:{}, fr:{}, imagenes:{} } ya decodificado
let CONT_ORIG = null;   // copia para saber qué se tocó
let IDIOMA = "es";
let slotEditando = null;
// Estructura completa del contenido.json del repo (proyecto, idiomas, imagenes,
// logo, video, proceso). Se usa como base para exportar: el editor sólo toca
// "textos", así que el resto se conserva tal cual está en el repositorio.
let CONTENIDO_BASE = null;

// ORDEN CANÓNICO de las claves, tomado del contenido.json del repositorio.
// Hace falta porque Firestore devuelve los campos de un mapa en SU orden, no
// en el que se escribieron: al volver a cargar el borrador, los campos
// aparecían mezclados —Párrafo 1 antes que Título— y el JSON exportado salía
// desordenado, ensuciando el diff en GitHub. El archivo del repositorio es la
// referencia de orden.
let ORDEN = { es: [], fr: [] };

async function cargarBaseJSON() {
  try {
    const r = await fetch("contenido.json", { cache: "no-store" });
    CONTENIDO_BASE = await r.json();
    ["es", "fr"].forEach((l) => {
      ORDEN[l] = Object.keys((CONTENIDO_BASE.textos || {})[l] || {});
    });
  } catch (e) { CONTENIDO_BASE = null; }
}

// Claves en orden canónico primero, y al final las que no estén en el archivo
// (por si alguna se agregó desde el panel). Nunca se pierde ninguna.
function clavesOrdenadas(l) {
  const dic = CONT[l] || {};
  const canon = ORDEN[l] || [];
  const vistas = new Set();
  const salida = [];
  canon.forEach((k) => { if (k in dic) { salida.push(k); vistas.add(k); } });
  Object.keys(dic).forEach((k) => { if (!vistas.has(k)) salida.push(k); });
  return salida;
}

const decod = (v) => (typeof v === "string" && v.slice(0,5) === "json:")
  ? (() => { try { return JSON.parse(v.slice(5)); } catch (e) { return v; } })() : v;
const codif = (v) => (typeof v === "string") ? v : "json:" + JSON.stringify(v);

function decodMapa(m) {
  const o = {};
  Object.keys(m || {}).forEach((k) => { o[k] = decod(m[k]); });
  return o;
}
function codifMapa(m) {
  const o = {};
  Object.keys(m || {}).forEach((k) => { o[k] = codif(m[k]); });
  return o;
}

/* ── cargar ── */
async function cargarContenido() {
  $("c-grupos").innerHTML = '<p class="empty">Cargando…</p>';
  let origen = "";
  await cargarBaseJSON(); // siempre, para tener imagenes/logo/video/proceso al exportar
  try {
    // Un solo documento en la base: el borrador. Lo publicado vive en el
    // contenido.json del repositorio, no en Firestore.
    let d = await getDoc(doc(db, "sitio", "borrador"));
    if (!(d.exists() && d.data().es)) d = null;
    else origen = "borrador guardado en la base";
    if (d) {
      const x = d.data();
      // MEZCLA, no reemplazo. El borrador manda para lo que tiene, y el
      // archivo del repositorio completa el resto.
      //
      // Antes se tomaba sólo el borrador, y toda clave agregada al
      // contenido.json DESPUÉS de guardar el borrador desaparecía al
      // exportar: así se perdieron las 9 claves alb.* de la página de
      // álbumes. Un borrador viejo no puede borrar texto nuevo.
      const baseT = (CONTENIDO_BASE && CONTENIDO_BASE.textos) || { es: {}, fr: {} };
      CONT = {
        es: { ...(baseT.es || {}), ...decodMapa(x.es) },
        fr: { ...(baseT.fr || {}), ...decodMapa(x.fr) },
        imagenes: { ...((CONTENIDO_BASE || {}).reemplazos || {}), ...(x.imagenes || {}) },
      };
    } else {
      const j = CONTENIDO_BASE || await (await fetch("contenido.json", { cache: "no-store" })).json();
      CONT = { es: { ...j.textos.es }, fr: { ...j.textos.fr },
               imagenes: { ...(j.reemplazos || {}) } };
      origen = "contenido.json · todavía no se sembró la base";
    }
    CONT_ORIG = JSON.parse(JSON.stringify(CONT));
    $("c-nota").innerHTML = origen.indexOf("contenido.json") === 0
      ? '<b>Guardar</b> deja los cambios en la base para que no se pierdan. Para que los vea el público: <b>Exportar JSON</b> y subir ese archivo al repositorio.'
      : 'Estás editando el borrador guardado en la base. <b>El sitio todavía muestra el contenido.json del repositorio</b>: para publicar, Exportar JSON y subirlo.';
    pintarContenido();
  } catch (e) {
    $("c-grupos").innerHTML = `<p class="empty">No se pudo cargar.<br>${CY.esc(CY.explicar(e))}</p>`;
  }
  $("c-sub").textContent = origen ? "origen: " + origen : "";
}

/* ── pintar ── */
function pintarContenido() {
  const cont = $("c-grupos"); cont.innerHTML = "";
  const dic = CONT[IDIOMA];
  const claves = clavesOrdenadas(IDIOMA);
  const usadas = new Set();

  GRUPOS.forEach((g) => {
    const mias = claves.filter((k) => g.pre.indexOf(k.split(".")[0]) !== -1);
    if (!mias.length) return;
    mias.forEach((k) => usadas.add(k));
    const det = document.createElement("details");
    det.className = "grupo";
    det.innerHTML = `<summary><b></b><span class="c">${mias.length}</span><span>›</span></summary>
                     <div class="grupo-cuerpo"></div>`;
    det.querySelector("b").textContent = g.t;
    const cuerpo = det.querySelector(".grupo-cuerpo");
    mias.forEach((k) => cuerpo.appendChild(campo(k, dic[k])));
    cont.appendChild(det);
  });

  // Cualquier clave que no entre en un grupo: se muestra igual, no se pierde.
  const sueltas = claves.filter((k) => !usadas.has(k));
  if (sueltas.length) {
    const det = document.createElement("details");
    det.className = "grupo";
    det.innerHTML = `<summary><b>Otras</b><span class="c">${sueltas.length}</span><span>›</span></summary>
                     <div class="grupo-cuerpo"></div>`;
    sueltas.forEach((k) => det.querySelector(".grupo-cuerpo").appendChild(campo(k, dic[k])));
    cont.appendChild(det);
  }

  // Imágenes
  const det = document.createElement("details");
  det.className = "grupo";
  det.innerHTML = `<summary><b>Imágenes del sitio</b><span class="c">${SLOTS.length}</span><span>›</span></summary>
                   <div class="grupo-cuerpo"><div class="slots"></div>
                   <p class="ayuda" style="margin-top:.8rem">Las imágenes son las mismas en los dos idiomas.
                   Tocá una para elegir otra de un álbum. Si una foto de Cloudinary no carga, el sitio
                   vuelve sola a la del repositorio.</p></div>`;
  const rejilla = det.querySelector(".slots");
  SLOTS.forEach((slot) => {
    const pid = CONT.imagenes[slot];
    const el = document.createElement("div");
    el.className = "slot";
    el.innerHTML = `<img alt="" loading="lazy"><div class="pie"><span></span><i></i></div>`;
    el.querySelector("img").src = pid ? CY.miniatura(pid, 400) : "assets/" + slot + ".jpg";
    el.querySelector("span").textContent = slot;
    el.querySelector("i").textContent = pid ? "álbum" : "repo";
    el.addEventListener("click", () => abrirGaleria(slot));
    rejilla.appendChild(el);
  });
  cont.appendChild(det);

  contarCambios();
}

function campo(clave, valor) {
  const el = document.createElement("div");
  el.className = "campo";
  el.innerHTML = `<div class="et"><b></b><code></code></div><textarea rows="2"></textarea>
                  <div class="ayuda hide"></div>`;
  el.querySelector("b").textContent = etiqueta(clave);
  el.querySelector("code").textContent = clave;
  const ta = el.querySelector("textarea");
  const ayuda = el.querySelector(".ayuda");

  const esFilas = Array.isArray(valor) && Array.isArray(valor[0]);
  const esLista = Array.isArray(valor) && !esFilas;

  if (esFilas) {
    // Tabla: una fila por línea, celdas separadas por |
    ta.value = valor.map((f) => f.join(" | ")).join("\n");
    ta.rows = Math.max(3, valor.length);
    ayuda.textContent = "Una fila por línea. Las celdas se separan con |";
    ayuda.classList.remove("hide");
  } else if (esLista) {
    ta.value = valor.join("\n");
    ta.rows = Math.max(3, valor.length);
    ayuda.textContent = "Un punto por línea.";
    ayuda.classList.remove("hide");
  } else {
    ta.value = valor == null ? "" : String(valor);
    ta.rows = Math.min(8, Math.max(2, Math.ceil(ta.value.length / 42)));
  }

  ta.addEventListener("input", () => {
    let v;
    if (esFilas) v = ta.value.split("\n").filter((l) => l.trim() !== "")
      .map((l) => l.split("|").map((c) => c.trim()));
    else if (esLista) v = ta.value.split("\n").filter((l) => l.trim() !== "");
    else v = ta.value;
    CONT[IDIOMA][clave] = v;
    ta.classList.add("tocado");
    contarCambios();
  });
  return el;
}

function contarCambios() {
  let n = 0;
  ["es", "fr"].forEach((l) => {
    Object.keys(CONT[l]).forEach((k) => {
      if (JSON.stringify(CONT[l][k]) !== JSON.stringify(CONT_ORIG[l][k])) n++;
    });
  });
  const imgs = Object.keys(CONT.imagenes).filter(
    (k) => CONT.imagenes[k] !== CONT_ORIG.imagenes[k]).length;
  const total = n + imgs;
  $("c-cuenta").textContent = total
    ? `${total} cambio${total > 1 ? "s" : ""} sin guardar`
    : "Sin cambios";
  $("c-guardar").disabled = !total;
}

/* ── idioma ── */
function verIdioma(l) {
  IDIOMA = l;
  $("l-es").classList.toggle("on", l === "es");
  $("l-fr").classList.toggle("on", l === "fr");
  pintarContenido();
}
$("l-es").addEventListener("click", () => verIdioma("es"));
$("l-fr").addEventListener("click", () => verIdioma("fr"));

/* ── guardar y publicar ── */
$("c-guardar").addEventListener("click", async () => {
  const b = $("c-guardar"); b.disabled = true; b.textContent = "Guardando…";
  try {
    // setDoc del mapa COMPLETO: nunca updateDoc de una clave con punto (§3.20).
    await setDoc(doc(db, "sitio", "borrador"), {
      es: codifMapa(CONT.es), fr: codifMapa(CONT.fr),
      imagenes: CONT.imagenes,
      idiomas: ["es", "fr"],
      guardado: serverTimestamp(), guardadoPor: yo.email
    });
    CONT_ORIG = JSON.parse(JSON.stringify(CONT));
    toast("Guardado en la base. Para publicarlo: Exportar JSON y subir ese archivo al repositorio.");
    contarCambios();
  } catch (e) { toast(CY.explicar(e), true); }
  finally { b.textContent = "Guardar"; contarCambios(); }
});

/* ── recargar y comparar ──
   Vuelve a leer las dos fuentes desde cero y dice en qué difieren: lo que
   está guardado en la base contra lo que está publicado en el
   contenido.json del repositorio. Es la respuesta a "¿por qué el sitio no
   muestra lo que edité?". */
$("c-recargar").addEventListener("click", async () => {
  const b = $("c-recargar"); b.disabled = true; b.textContent = "…";
  try {
    // El parámetro saltea la caché de GitHub Pages, que sirve los archivos
    // con unos minutos de vida.
    const r = await fetch("contenido.json?v=" + Date.now(), { cache: "no-store" });
    const j = await r.json();
    const enJson = (j.textos || {});

    const d = await getDoc(doc(db, "sitio", "borrador"));
    const enBase = d.exists() ? d.data() : null;

    // Se recarga el editor con lo que hay ahora, descartando lo no guardado.
    CONTENIDO_BASE = j;
    ["es", "fr"].forEach((l) => { ORDEN[l] = Object.keys(enJson[l] || {}); });

    let dif = [];
    if (enBase && enBase.es) {
      CONT = {
        es: { ...(enJson.es || {}), ...decodMapa(enBase.es) },
        fr: { ...(enJson.fr || {}), ...decodMapa(enBase.fr) },
        imagenes: { ...(j.reemplazos || {}), ...(enBase.imagenes || {}) },
      };
      // Los reemplazos también se comparan contra el archivo publicado.
      Object.keys({ ...(j.reemplazos || {}), ...CONT.imagenes }).forEach((k) => {
        if ((CONT.imagenes[k] || "") !== ((j.reemplazos || {})[k] || "")) dif.push("img:" + k);
      });
      ["es", "fr"].forEach((l) => {
        Object.keys(CONT[l]).forEach((k) => {
          const a = JSON.stringify(CONT[l][k]);
          const bb = JSON.stringify((enJson[l] || {})[k]);
          if (a !== bb) dif.push(`${l}:${k}`);
        });
      });
    } else {
      CONT = { es: { ...enJson.es }, fr: { ...enJson.fr },
               imagenes: { ...(j.reemplazos || {}) } };
    }
    CONT_ORIG = JSON.parse(JSON.stringify(CONT));

    const imgs = Object.keys(CONT.imagenes || {}).filter((k) => CONT.imagenes[k]).length;
    $("c-sub").textContent = enBase
      ? `base: ${Object.keys(CONT.es).length} textos · repositorio: ${Object.keys(enJson.es || {}).length}`
      : "sólo el repositorio · la base está vacía";
    $("c-nota").innerHTML = !enBase
      ? 'No hay nada guardado en la base. Estás viendo el <b>contenido.json</b> del repositorio.'
      : dif.length
        ? `Hay <b>${dif.length} diferencia${dif.length === 1 ? "" : "s"}</b> entre la base y lo publicado`
          + `${imgs ? `, más ${imgs} imagen${imgs === 1 ? "" : "es"} reemplazada${imgs === 1 ? "" : "s"}` : ""}.`
          + ` Para publicar: <b>Exportar JSON</b> y subir ese archivo al repositorio.`
          + `<br><span style="font-family:var(--mono);font-size:.56rem;color:var(--dim)">`
          + dif.slice(0, 12).map(CY.esc).join("  ")
          + (dif.length > 12 ? `  +${dif.length - 12}` : "") + "</span>"
        : "La base y el repositorio dicen <b>lo mismo</b>. El sitio muestra lo que ves acá.";
    pintarContenido();
    toast(dif.length
      ? `${dif.length} diferencia${dif.length === 1 ? "" : "s"} sin publicar`
      : "Todo al día: la base y el sitio coinciden");
  } catch (e) { toast(CY.explicar(e), true); }
  finally { b.disabled = false; b.textContent = "↻"; }
});

/* ── exportar contenido.json para el repositorio ── */
function construirExportable() {
  // Sale con la misma forma que contenido.json: lo único que cambia acá es
  // "textos"; imagenes/logo/video/proceso quedan como están en el repo.
  const base = CONTENIDO_BASE || {};
  // Se reconstruye en orden canónico: así el diff en GitHub muestra sólo lo
  // que cambió y no un archivo entero reordenado.
  const enOrden = (l) => {
    const o = {};
    clavesOrdenadas(l).forEach((k) => { o[k] = CONT[l][k]; });
    return o;
  };
  return {
    proyecto: base.proyecto || "CasaYourte",
    // Firma del código que generó este archivo. Sirve para saber, mirando el
    // JSON, si salió del panel actualizado o de una copia vieja en caché.
    generadoPor: PANEL,
    generadoEl: new Date().toISOString().slice(0, 16).replace("T", " "),
    idiomas: base.idiomas || ["es", "fr"],
    textos: { es: enOrden("es"), fr: enOrden("fr") },
    // ESTO es lo que faltaba: los reemplazos elegidos desde la galería.
    // Antes se copiaba "imagenes" del archivo original y se ignoraba lo
    // editado, así que el JSON exportado seguía apuntando a la foto vieja.
    // Mapa slot -> public_id de Cloudinary. Vacío = se usa la de assets/.
    reemplazos: { ...(CONT.imagenes || {}) },
    imagenes: base.imagenes || [],
    logo: base.logo,
    video: base.video,
    proceso: base.proceso,
  };
}

function clavesCambiadas() {
  const out = [];
  ["es", "fr"].forEach((l) => {
    Object.keys(CONT[l]).forEach((k) => {
      if (JSON.stringify(CONT[l][k]) !== JSON.stringify(CONT_ORIG[l][k])) out.push(`${l}:${k}`);
    });
  });
  return out;
}

$("c-exportar").addEventListener("click", () => {
  try {
    // Red de seguridad: si el archivo fuera a salir con menos claves que el
    // del repositorio, algo se está perdiendo y hay que parar.
    const base = (CONTENIDO_BASE && CONTENIDO_BASE.textos) || null;
    if (base) {
      const faltan = ["es", "fr"].flatMap((l) =>
        Object.keys(base[l] || {}).filter((k) => !(k in CONT[l])).map((k) => l + ":" + k));
      if (faltan.length) {
        toast(`No se exporta: faltarían ${faltan.length} textos que sí están en el `
          + `repositorio (${faltan.slice(0, 3).join(", ")}…). Tocá ↻ y volvé a intentar.`, true);
        return;
      }
    }
    const cambios = clavesCambiadas();
    const salida = construirExportable();
    const json = JSON.stringify(salida, null, 2);

    // Descarga al dispositivo, para reemplazar el archivo a mano en el repo.
    const blob = new Blob([json], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "contenido.json";
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);

    toast(cambios.length
      ? `JSON descargado con ${cambios.length} cambio${cambios.length > 1 ? "s" : ""} sin guardar incluido${cambios.length > 1 ? "s" : ""}. Subilo al repositorio.`
      : "JSON descargado. Subilo al repositorio.");
  } catch (e) {
    toast(CY.explicar(e), true);
  }
});

/* ── galería para elegir la imagen de un slot ── */
let galAlbums = [], galFotos = [], galFiltro = "todas";

async function abrirGaleria(slot) {
  slotEditando = slot;
  $("g-sub").textContent = "para el lugar “" + slot + "”";
  verPantalla("gal");
  $("g-grid").innerHTML = '<p class="empty">Cargando álbumes…</p>';
  try {
    if (!galAlbums.length) {
      const snap = await getDocs(collection(db, "albums"));
      galAlbums = snap.docs.map((d) => ({ id: d.id, ...d.data() }))
        .sort((a, b) => (a.titulo || a.id).localeCompare(b.titulo || b.id, "es"));
      $("g-album").innerHTML = "";
      galAlbums.forEach((a) => {
        const o = document.createElement("option");
        o.value = a.id; o.textContent = a.titulo || a.id;
        $("g-album").appendChild(o);
      });
    }
    if (!galAlbums.length) {
      $("g-grid").innerHTML = '<p class="empty">Todavía no hay álbumes.<br>Creá uno y subí fotos primero.</p>';
      return;
    }
    await cargarFotosGaleria();
  } catch (e) {
    $("g-grid").innerHTML = `<p class="empty">${CY.esc(CY.explicar(e))}</p>`;
  }
}

$("g-album").addEventListener("change", cargarFotosGaleria);

async function cargarFotosGaleria() {
  const id = $("g-album").value;
  $("g-grid").innerHTML = '<p class="empty">Cargando fotos…</p>';
  const snap = await getDocs(collection(db, "albums", id, "fotos"));
  galFotos = snap.docs.map((d) => ({ id: d.id, ...d.data() }))
    .filter((f) => !f.eliminada)
    .sort((a, b) => (a.orden || 0) - (b.orden || 0));
  // Filtros por etapa, armados con lo que realmente hay.
  const etapas = [...new Set(galFotos.map((f) => f.etapa).filter(Boolean))];
  const f = $("g-filtros"); f.innerHTML = "";
  [["todas", "todas"], ["catalogo", "aptas para el catálogo"]].concat(
    etapas.map((e) => [e, e.replace(/^\d+-/, "").replace(/-/g, " ")])
  ).forEach(([val, txt]) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = txt;
    b.dataset.val = val;
    b.className = val === galFiltro ? "on" : "";
    b.addEventListener("click", () => { galFiltro = val; pintarGaleria(); });
    f.appendChild(b);
  });
  pintarGaleria();
}

function pintarGaleria() {
  // Se compara por el valor guardado en el botón, no por su texto: el texto
  // está traducido y comparar contra él rompía el resaltado del filtro.
  $("g-filtros").querySelectorAll("button").forEach((b) => {
    b.classList.toggle("on", b.dataset.val === galFiltro);
  });
  let lista = galFotos;
  if (galFiltro === "catalogo") lista = lista.filter((f) => f.usar);
  else if (galFiltro !== "todas") lista = lista.filter((f) => f.etapa === galFiltro);

  const g = $("g-grid"); g.innerHTML = "";
  $("g-vacio").classList.toggle("hide", lista.length > 0);
  lista.forEach((f) => {
    const el = document.createElement("div");
    el.className = "ph";
    el.innerHTML = `<img loading="lazy" alt="">
      ${f.personas ? '<span class="flag" title="Gente identificable">👤</span>' : ""}
      <div class="bar"><span class="pos" style="flex:1;text-align:center">Usar esta</span></div>`;
    el.querySelector("img").src = CY.miniatura(f.public_id, 400);
    el.addEventListener("click", () => elegirFoto(f));
    g.appendChild(el);
  });
}

function elegirFoto(f) {
  if (f.personas && !confirm(
    "Esta foto está marcada como que tiene gente identificable.\n\n"
    + "Publicarla necesita su autorización. ¿Usarla igual?")) return;
  CONT.imagenes[slotEditando] = f.public_id;
  toast("Imagen elegida. Acordate de guardar.");
  volverDeGaleria();
}

$("g-repo").addEventListener("click", () => {
  delete CONT.imagenes[slotEditando];
  toast("Vuelve a usarse la imagen del repositorio.");
  volverDeGaleria();
});

function volverDeGaleria() {
  verPantalla("cont");
  pintarContenido();
}

/* ── entrada a la sección ── */



/* ── dos pantallas: el contenido y la galería ── */
let cerrarGal = null;
function verPantalla(v) {
  $("v-cont").classList.toggle("hide", v !== "cont");
  $("v-gal").classList.toggle("hide", v !== "gal");
  $("c-barra").classList.toggle("hide", v !== "cont");
  if (v === "gal" && !cerrarGal) {
    // el Atrás de Android vuelve al contenido, no sale de la app
    cerrarGal = CY.capaAtras(() => { cerrarGal = null; verPantalla("cont"); pintarContenido(); });
  } else if (v === "cont" && cerrarGal) {
    const c = cerrarGal; cerrarGal = null; c();
  }
  window.scrollTo(0, 0);
}

$("c-barra").classList.remove("hide");
cargarContenido();

</script>
