<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>CasaYourte · Diagnóstico</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..700,0..100,0..1&family=Instrument+Sans:wght@400..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="stylesheet" href="./estilos.css">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#181614">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icono-192.png">
<style>

</style>
</head>
<body>

<div id="nav"></div>

<div class="contenedor">
  <section id="v-diag">
    <h1 style="font-size:1.5rem;margin-bottom:.3rem">Diagnóstico</h1>
    <p class="note">Prueba las tres conexiones y dice exactamente qué arreglar si algo falla.
    No modifica nada de tus datos.</p>
    <button class="btn p" id="dg-run">Probar todo</button>
    <div id="dg-out" style="margin-top:1.2rem"></div>
  </section>


</div>

<script type="module">
import { db, auth, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc,
         collection, serverTimestamp, onAuthStateChanged, signOut } from "./firebase-init.js";
import { CY } from "./nucleo.js";

CY.PANEL = "diagnostico-4";
CY.alSalir = () => { CY.usuario = null; signOut(auth).then(() => location.replace("./admin.html")); };

const yo = await CY.arrancar({ db, auth, doc, getDoc, onAuthStateChanged }, "diag", null);

const $ = (id) => document.getElementById(id);
const explicar = CY.explicar;
const toast = CY.aviso;
const puede = CY.puede;
const CLOUD = CY.CLOUDINARY.cloud;
const PRESET = CY.CLOUDINARY.preset;

/* ===================== DIAGNÓSTICO ===================== */
$("dg-run").addEventListener("click", async () => {
  const out = $("dg-out"); out.innerHTML = "";
  const b = $("dg-run"); b.disabled = true; b.textContent = "Probando…";

  const fila = (nombre) => {
    const el = document.createElement("div");
    el.className = "card";
    el.style.alignItems = "flex-start";
    el.innerHTML = `<span style="font-size:1.1rem;flex:none">⏳</span>
      <div class="grow"><h2 style="font-size:.98rem"></h2>
      <div class="sub" style="margin-top:.2rem"></div></div>`;
    el.querySelector("h2").textContent = nombre;
    out.appendChild(el);
    return {
      ok: (m) => { el.firstChild.textContent = "✅"; el.querySelector(".sub").textContent = m; },
      // Ni bien ni mal: algo que hay que mirar, pero no está roto.
      ojo: (m) => { el.firstChild.textContent = "⚠️";
        el.querySelector(".sub").textContent = m;
        el.querySelector(".sub").style.color = "#C08A3E"; },
      mal: (m) => { el.firstChild.textContent = "❌";
        el.querySelector(".sub").textContent = m;
        el.querySelector(".sub").style.color = "#E9A8B0"; },
    };
  };

  // 0 · versiones · lo primero, porque explica casi cualquier rareza
  let f = fila("Versión del código");
  f.ok(`panel ${PANEL} · núcleo ${CY.VERSION}`
    + (CY.instalada() ? " · corriendo como app instalada" : ""));

  // 1 · proyecto de Firebase
  f = fila("Proyecto de Firebase");
  f.ok(`${firebaseConfig.projectId} · conectado`);

  // 2 · tu usuario y tu rol
  f = fila("Tu usuario y permisos");
  try {
    const d = await getDoc(doc(db, "usuarios", yo.uid));
    if (!d.exists()) f.mal("No existe tu documento en la colección usuarios. El ID del documento tiene que ser tu UID exacto.");
    else {
      const u = d.data();
      if (u.activo !== true) f.mal("Tu campo activo no es true (tiene que ser boolean, no texto).");
      else {
        const p = CY.PERMISOS.filter(x => (u.permisos || {})[x.id]).map(x => x.label);
        f.ok(`${u.email} · ${u.rol === "admin" ? "administrador · todo"
          : (p.length ? "colaborador · " + p.join(", ") : "colaborador · sin permisos")}`);
      }
    }
  } catch (e) { f.mal(explicar(e)); }

  // 3 · leer álbumes
  f = fila("Leer álbumes");
  try {
    const snap = await getDocs(collection(db, "albums"));
    f.ok(`${snap.size} álbumes`);
  } catch (e) { f.mal(explicar(e)); }

  // 4 · escribir y borrar en Firestore
  f = fila("Escribir en Firestore");
  try {
    // OJO: Firestore RESERVA los identificadores con forma __algo__ y
    // rechaza la escritura con invalid-argument. El nombre de esta prueba
    // no puede tener esa forma.
    const ref = doc(db, "albums", "zz-prueba-diagnostico");
    await setDoc(ref, { titulo: "prueba de diagnóstico", tipo: "obra" });
    await deleteDoc(ref);
    f.ok("Escritura y borrado correctos");
  } catch (e) { f.mal(explicar(e)); }

  // 5 · Cloudinary
  f = fila("Cloudinary · preset de subida");
  try {
    const cv = document.createElement("canvas"); cv.width = cv.height = 8;
    const ctx = cv.getContext("2d"); ctx.fillStyle = "#DCA96B"; ctx.fillRect(0, 0, 8, 8);
    const blob = await new Promise(r => cv.toBlob(r, "image/jpeg", .5));
    const fd = new FormData();
    fd.append("file", blob);
    fd.append("upload_preset", PRESET);
    fd.append("folder", "casayourte/pruebas");
    fd.append("tags", "prueba");
    const r = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD}/image/upload`,
      { method: "POST", body: fd });
    const j = await r.json();
    if (r.ok) f.ok(`Preset "${PRESET}" funcionando. Dejó una imagen de 8 píxeles en la carpeta "pruebas" de Cloudinary; se puede borrar o dejar.`);
    else {
      const m = j.error?.message || "rechazado";
      f.mal(/preset/i.test(m)
        ? `El preset "${PRESET}" no existe o no es unsigned. Crealo en Cloudinary: Settings → Upload → Add upload preset, con Signing mode en Unsigned.`
        : m);
    }
  } catch (e) { f.mal("No se pudo contactar Cloudinary: " + e.message); }

  // 6 · app instalable
  f = fila("App instalable");
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    const man = document.querySelector('link[rel="manifest"]');
    if (!man) f.mal("Falta el manifest.json en la página.");
    else if (!reg) f.mal("El service worker no está registrado. Recargá la página una vez con señal.");
    else if (CY.instalada()) f.ok("Corriendo como app instalada.");
    else f.ok("Lista para instalar. En Chrome: menú ⋮ → Agregar a la pantalla principal.");
  } catch (e) { f.mal("No se pudo verificar: " + e.message); }

  // 7 · contenido del sitio
  f = fila("Contenido del sitio");
  try {
    // La autoridad es sitio/publicado: lo que está ahí es lo que ve el
    // público. El contenido.json del repositorio quedó como respaldo por si
    // Firestore no responde.
    const pu = await getDoc(doc(db, "sitio", "publicado"));
    const np = (pu.exists() && pu.data().es) ? Object.keys(pu.data().es).length : 0;
    const r = await fetch("contenido.json", { cache: "no-store" });
    const j = await r.json();
    const nj = Object.keys((j.textos || {}).es || {}).length;
    if (!np) {
      f.ojo(`El sitio todavía no tiene contenido propio: está mostrando el respaldo `
        + `del repositorio, ${nj} textos. Entrá a Editar y tocá Publicar una vez.`);
    } else {
      const faltan = Object.keys((j.textos || {}).es || {})
        .filter((k) => !(k in pu.data().es)).length;
      f.ok(`publicado: ${np} textos · respaldo del repositorio: ${nj}`
        + (faltan ? ` · ojo: ${faltan} claves del respaldo no están publicadas` : " · completo"));
    }
  } catch (e) { f.mal(explicar(e)); }

  // 8 · archivos en la papelera
  f = fila("Papelera de fotos");
  try {
    const al = await getDocs(collection(db, "albums"));
    let n = 0;
    for (const a of al.docs) {
      const fs = await getDocs(collection(db, "albums", a.id, "fotos"));
      n += fs.docs.filter((d) => d.data().eliminada).length;
    }
    f.ok(n
      ? `${n} foto${n === 1 ? "" : "s"} en la papelera. Los archivos siguen en Cloudinary: `
        + "el panel no puede borrarlos de ahí, se borran desde el panel de Cloudinary."
      : "Ninguna foto en la papelera.");
  } catch (e) { f.mal(explicar(e)); }


  /* ── LAS NEGATIVAS ─────────────────────────────────────────────
     Acá lo bueno es que FALLE. Que una lectura funcione prueba que ESA
     lectura está permitida; NO prueba que lo prohibido esté prohibido — y eso
     es lo único que demuestra que lo publicado en la consola es REGLAS.txt y
     no otra cosa. El archivo del repositorio es una copia; la autoridad es la
     consola, y pueden divergir sin aviso.
     Ver PROTOCOLO-DESARROLLO.md §11.3 en el repositorio `datos`. */

  // 9 · deny por defecto, leyendo
  f = fila("Reglas vivas · leer una colección sin bloque");
  try {
    await getDocs(collection(db, "zz-diagnostico-sin-regla"));
    f.mal("SE PUDO LEER una colección que no tiene bloque propio. El cierre "
      + "`match /{document=**} { allow read, write: if false }` de REGLAS.txt no está "
      + "publicado, o hay otro bloque que lo anula: la base está más abierta de lo que "
      + "se cree. Pegá REGLAS.txt completo en la consola.");
  } catch (e) {
    if (e.code === "permission-denied") f.ok("Denegado, como corresponde: el cierre de REGLAS.txt está publicado.");
    else f.ojo("No se pudo probar: " + explicar(e));
  }

  // 10 · deny por defecto, escribiendo
  f = fila("Reglas vivas · escribir en una colección sin bloque");
  try {
    await setDoc(doc(db, "zz-diagnostico-sin-regla", "prueba"), { t: Date.now() });
    f.mal("SE PUDO ESCRIBIR en una colección sin bloque propio. Borrá "
      + "zz-diagnostico-sin-regla/prueba desde la consola y republicá REGLAS.txt.");
  } catch (e) {
    if (e.code === "permission-denied") f.ok("Denegado, como corresponde.");
    else f.ojo("No se pudo probar: " + explicar(e));
  }

  // 11 · nadie se desactiva a sí mismo
  // Es la prueba del §4.8: la única evidencia de que las reglas publicadas son
  // las que se creen publicadas. Antes había que ir a la consola de Firebase a
  // poner activo:false a mano (GUIA-ANDROID.md E4); ahora la corre esta línea.
  // Es segura porque REGLAS.txt lo prohíbe: si igual pasara, se revierte acá.
  f = fila("Reglas vivas · desactivarte a vos mismo");
  const esAdm = CY.esAdmin();
  try {
    await updateDoc(doc(db, "usuarios", yo.uid), { activo: false });
    f.mal("LA ESCRITURA PASÓ: pudiste desactivarte a vos mismo. Las reglas publicadas "
      + "no son las de REGLAS.txt. Revirtiendo…");
    try {
      await updateDoc(doc(db, "usuarios", yo.uid), { activo: true });
      f.mal("Pasó, y se revirtió: tu cuenta volvió a activo:true. Pegá REGLAS.txt "
        + "completo en la consola antes de seguir.");
    } catch (e2) {
      f.mal("Pasó y NO SE PUDO REVERTIR. Poné activo:true a mano en la consola de "
        + "Firebase, en usuarios/" + yo.uid);
    }
  } catch (e) {
    if (e.code !== "permission-denied") f.ojo("No se pudo probar: " + explicar(e));
    else if (esAdm) f.ok("Denegado: la regla está publicada y viva. Es el resultado que se busca.");
    else f.ojo("Denegado — pero como no sos administrador, sólo prueba que un colaborador "
      + "no escribe usuarios. La cláusula de no desactivarse a uno mismo se comprueba "
      + "corriendo esto con una cuenta admin.");
  }

  b.disabled = false; b.textContent = "Probar de nuevo";
});


// Se corre solo al entrar: para eso se abre esta pantalla.
$("dg-run").click();

</script>
</body>
</html>
