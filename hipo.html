<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Hipotenusa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .calculator {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 300px;
        }
        h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #333;
            text-align: center;
        }
        .input-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 5px;
            color: #555;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            color: #333;
        }
    </style>
</head>
<body>

<div class="calculator">
    <h2>Calculadora de Hipotenusa</h2>
    <div class="input-group">
        <label for="catetoA">Cateto A:</label>
        <input type="number" id="catetoA" step="any" placeholder="Ingresa la medida">
    </div>
    <div class="input-group">
        <label for="catetoB">Cateto B:</label>
        <input type="number" id="catetoB" step="any" placeholder="Ingresa la medida">
    </div>
    <button onclick="calcularHipotenusa()">Calcular</button>
    <div class="result" id="resultado"></div>
</div>

<script>
    function calcularHipotenusa() {
        const a = parseFloat(document.getElementById('catetoA').value);
        const b = parseFloat(document.getElementById('catetoB').value);
        const resultadoDiv = document.getElementById('resultado');

        if (isNaN(a) || isNaN(b) || a <= 0 || b <= 0) {
            resultadoDiv.textContent = "Por favor, ingresa valores válidos.";
            return;
        }

        const hipotenusa = Math.sqrt((a * a) + (b * b));
        resultadoDiv.textContent = `Hipotenusa: ${hipotenusa.toFixed(2)}`;
    }
</script>

</body>
</html>
