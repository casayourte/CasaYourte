<style>
:root{
  --ink:#181614;
  --ink-2:#242019;
  --burg:#7A2C3C;
  --burg-lo:#5C1F2C;
  --blond:#DCA96B;
  --wool:#EFE8DA;
  --wool-2:#E2D9C7;
  --moss:#5A6A5F;
  --disp:"Fraunces",Georgia,serif;
  --body:"Instrument Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --pad:clamp(1.25rem,5vw,5.5rem);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--ink);color:var(--wool);
  font-family:var(--body);font-size:clamp(1rem,.55vw + .9rem,1.09rem);
  line-height:1.6;font-weight:400;
}
h1,h2,h3,h4{font-family:var(--disp);font-weight:500;
  font-variation-settings:"SOFT" 22,"WONK" 1;line-height:1.02;margin:0;
  letter-spacing:-.015em;}
p{margin:0 0 1em}
img{display:block;width:100%;height:100%;object-fit:cover}
a{color:inherit}

/* ---------- utility ---------- */
.mono{font-family:var(--mono);font-size:.66rem;letter-spacing:.15em;text-transform:uppercase}
.eyebrow{font-family:var(--mono);font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--blond);display:block;margin-bottom:1.6rem}
.eyebrow::before{content:"";display:inline-block;width:1.6rem;height:1px;
  background:var(--blond);vertical-align:.32em;margin-right:.7rem}
.wrap{padding:clamp(4rem,9vw,8rem) var(--pad)}
.lede{font-size:clamp(1.1rem,1.1vw + .85rem,1.35rem);line-height:1.5;max-width:38ch;color:var(--wool)}
.small{font-size:.86rem;line-height:1.55;color:#b7ae9d}

/* ---------- lattice signature ---------- */
.trei{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.trei line{stroke:var(--blond);stroke-width:1.15;opacity:.42;
  stroke-dasharray:var(--len);stroke-dashoffset:var(--len);
  animation:weave 1.5s cubic-bezier(.22,.7,.2,1) forwards;animation-delay:var(--d)}
@keyframes weave{to{stroke-dashoffset:0}}
.band{height:74px;overflow:hidden;position:relative;border-block:1px solid #35302a;background:var(--ink-2)}
.band svg line{stroke:var(--moss);stroke-width:1;opacity:.55;animation:none;stroke-dashoffset:0}

/* ---------- hero ---------- */
.hero-media{position:absolute;inset:0;z-index:0;overflow:hidden;background:#0C0A08}
.hero-media video{width:100%;height:100%;object-fit:cover;display:block}
.hero-media .scrim{position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(12,10,8,.82) 0%,rgba(12,10,8,.42) 38%,rgba(12,10,8,.88) 100%)}
header.hero .trei{z-index:1}
header.hero .trei line{opacity:.2}
/* Antes acá había 'display:none' para quien tenga reducidas las
   animaciones. Problema: el ahorro de batería de Android activa esa
   preferencia, así que con el teléfono bajo de carga el video
   desaparecía y quedaba la foto fija. Ahora el video se queda siempre;
   si el sistema pide menos movimiento, no arranca solo y se puede
   tocar para reproducir. */
.hero-play{position:absolute;left:50%;bottom:clamp(5rem,14vh,9rem);transform:translateX(-50%);
  z-index:4;display:none;align-items:center;gap:.5rem;
  font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;
  background:rgba(24,22,20,.72);color:var(--wool);border:1px solid #5a5145;
  border-radius:999px;padding:.55rem .9rem;cursor:pointer;backdrop-filter:blur(4px)}
.hero-play.on{display:inline-flex}
header.hero{position:relative;min-height:min(100svh,860px);display:flex;flex-direction:column;
  justify-content:space-between;padding:clamp(1.1rem,3vw,2.2rem) var(--pad) clamp(2.5rem,6vw,4rem);
  background:radial-gradient(120% 95% at 78% 8%,#2C2318 0%,var(--ink) 58%);overflow:hidden}
.topbar{position:relative;z-index:3;display:flex;justify-content:space-between;
  align-items:center;gap:1rem;flex-wrap:wrap}
.mark{font-family:var(--disp);font-size:1.02rem;letter-spacing:.3em;font-weight:600;
  text-transform:uppercase}
.mark span{color:var(--blond)}
.mark{display:flex;align-items:center;gap:.55rem}
.logo{width:34px;height:34px;opacity:.92;flex:none}
.mark{text-transform:none;letter-spacing:.16em}
.lang{display:flex;gap:0;border:1px solid #4a4238;border-radius:999px;overflow:hidden}
.lang button{font-family:var(--mono);font-size:.63rem;letter-spacing:.16em;
  background:none;border:0;color:#a89e8c;padding:.5rem .85rem;cursor:pointer;text-transform:uppercase}
.lang button[aria-pressed="true"]{background:var(--blond);color:var(--ink)}
.lang button:focus-visible{outline:2px solid var(--blond);outline-offset:2px}
.hero-body{position:relative;z-index:3;max-width:22ch}
h1{font-size:clamp(3rem,10.5vw,7.4rem);font-weight:300;
  font-variation-settings:"SOFT" 40,"WONK" 1}
h1 em{font-style:italic;color:var(--blond);font-weight:400}
.hero-meta{position:relative;z-index:3;display:flex;gap:clamp(1.2rem,4vw,3.5rem);
  flex-wrap:wrap;border-top:1px solid #3b342c;padding-top:1.4rem;margin-top:2.5rem}
.hero-meta div{max-width:24ch}
.hero-meta .k{color:var(--blond);display:block;margin-bottom:.35rem}
.hero-meta .v{font-size:.92rem;color:#cfc6b4}

/* ---------- full bleed ---------- */
.bleed{position:relative;height:clamp(320px,60vh,660px)}
.bleed img{filter:saturate(.94)}
.bleed figcaption{position:absolute;left:var(--pad);bottom:1.5rem;right:var(--pad);
  color:var(--wool);text-shadow:0 1px 14px rgba(0,0,0,.85)}

/* ---------- idea ---------- */
.idea-h{font-size:clamp(1.9rem,5vw,3.4rem);max-width:30ch;font-weight:300;
  font-variation-settings:"SOFT" 40,"WONK" 1}
.idea-h em{font-style:italic;color:var(--blond)}
.idea-cols{margin-top:clamp(2rem,4vw,3rem);display:grid;gap:1.4rem;max-width:78ch}
.idea-cols p{font-size:1rem;line-height:1.62;color:#c2b9a7}
.idea-k{margin-top:clamp(2rem,4vw,2.8rem);padding-top:1.4rem;border-top:1px solid #3b342c;
  font-family:var(--disp);font-style:italic;font-weight:300;color:var(--blond);
  font-size:clamp(1.2rem,2.6vw,1.75rem);line-height:1.28;max-width:34ch;
  font-variation-settings:"SOFT" 45,"WONK" 1}
@media(min-width:900px){.idea-cols{grid-template-columns:1fr 1fr;gap:1.4rem 2.6rem}
  .idea-cols p:first-child{grid-column:1/-1;font-size:1.08rem;color:var(--wool);max-width:52ch}}

/* ---------- proceso ---------- */
.proc{margin:clamp(2.2rem,5vw,3.4rem) 0 0}
.proc-stage{position:relative;aspect-ratio:16/9;overflow:hidden;background:#0E0C0A;
  border:1px solid #35302a}
.proc-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity .8s ease}
.proc-stage img.on{opacity:1}
.proc-bar{display:flex;gap:3px;margin-top:.5rem}
.proc-bar i{flex:1;height:2px;background:#3b342c;cursor:pointer;transition:background .3s}
.proc-bar i.on{background:var(--blond)}
.proc-cap{display:flex;gap:.8rem;align-items:baseline;margin-top:.9rem;min-height:2.6em}
.proc-n{color:var(--blond);flex:none;padding-top:.15rem}
.proc-t{font-size:.95rem;color:#c2b9a7;line-height:1.45}
.proc-ctl{display:flex;gap:.4rem;margin-top:.6rem}
.proc-ctl button{font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;
  text-transform:uppercase;background:none;border:1px solid #4a4238;color:#a89e8c;
  padding:.4rem .7rem;border-radius:2px;cursor:pointer;min-width:2.4rem}
.proc-ctl button:hover{border-color:var(--blond);color:var(--wool)}
@media(prefers-reduced-motion:reduce){.proc-stage img{transition:none}}

/* ---------- trajectory ---------- */
.paper{background:var(--wool);color:var(--ink)}
.paper .eyebrow{color:var(--burg)}
.paper .eyebrow::before{background:var(--burg)}
.paper .small{color:#5f574a}
.steps{margin-top:clamp(2.5rem,6vw,4rem);display:grid;gap:clamp(2rem,4vw,3rem)}
.step{display:grid;grid-template-columns:1fr;gap:1.2rem;
  padding-top:1.6rem;border-top:1px solid #cfc4ae}
.step-fig{aspect-ratio:4/3;overflow:hidden;background:#d8cebb}
.step h3{font-size:clamp(1.35rem,2.4vw,1.9rem);margin-bottom:.55rem}
.step .yr{font-family:var(--mono);font-size:.66rem;letter-spacing:.18em;color:var(--burg);
  display:block;margin-bottom:.7rem}
.step p{font-size:.95rem;color:#443d33;margin:0}
@media(min-width:760px){
  .step{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(1.5rem,4vw,3rem);align-items:start}
  .step:nth-child(even) .step-fig{order:2}
}

/* ---------- differentials ---------- */
.diffs{margin-top:clamp(2.5rem,6vw,4rem);display:grid;gap:1px;background:#35302a;
  border:1px solid #35302a}
.diff{background:var(--ink-2);padding:clamp(1.4rem,3vw,2.2rem)}
.diff-fig{aspect-ratio:16/10;overflow:hidden;margin:-.4rem -.4rem 1.4rem;background:#111}
.diff h3{font-size:clamp(1.15rem,1.9vw,1.5rem);margin-bottom:.7rem}
.diff .spec{font-family:var(--mono);font-size:.64rem;letter-spacing:.14em;color:var(--blond);
  display:block;margin-bottom:1rem;text-transform:uppercase}
.diff p{font-size:.92rem;color:#c2b9a7;margin:0}
@media(min-width:720px){.diffs{grid-template-columns:1fr 1fr}}
@media(min-width:1100px){.diffs{grid-template-columns:repeat(3,1fr)}}

/* ---------- interior ---------- */
.intgrid{margin-top:clamp(2.5rem,6vw,4rem);display:grid;gap:clamp(1.2rem,3vw,2rem)}
.int-main{margin:0;aspect-ratio:3/4;overflow:hidden;background:#d8cebb}
.int-side{display:flex;flex-direction:column;gap:.8rem}
.int-sm{margin:0;aspect-ratio:16/9;overflow:hidden;background:#d8cebb}
.int-side .small{margin:0 0 .6rem}
@media(min-width:820px){.intgrid{grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);align-items:start}}

/* ---------- offer ---------- */
.offer{background:var(--burg-lo);color:var(--wool)}
.offer .eyebrow{color:var(--blond)}
.lines{margin-top:clamp(2.5rem,6vw,4rem);display:grid;gap:1.5rem}
.line{border:1px solid #8B4354;background:#6C2637;padding:clamp(1.4rem,3vw,2.1rem);
  display:flex;flex-direction:column;gap:.9rem}
.line-no{font-family:var(--mono);font-size:.64rem;letter-spacing:.2em;color:var(--blond)}
.line h3{font-size:clamp(1.25rem,2.1vw,1.6rem)}
.line p{font-size:.93rem;color:#e8d9dd;margin:0}
.line ul{margin:0;padding-left:1.1rem;font-size:.88rem;color:#e0cdd2}
.line li{margin-bottom:.35rem}
.line .tag{margin-top:auto;padding-top:.9rem;border-top:1px solid #8B4354;
  font-family:var(--mono);font-size:.63rem;letter-spacing:.13em;color:var(--blond);text-transform:uppercase}
@media(min-width:820px){.lines{grid-template-columns:1fr 1fr}}

/* ---------- two column prose ---------- */
.duo{display:grid;gap:clamp(2rem,5vw,4rem);align-items:center}
.duo-fig{aspect-ratio:5/4;overflow:hidden;background:#111}
@media(min-width:860px){.duo{grid-template-columns:1.05fr .95fr}}
.quote{font-family:var(--disp);font-size:clamp(1.4rem,3vw,2.15rem);line-height:1.22;
  font-style:italic;font-weight:300;color:var(--blond);margin:0 0 1.6rem;
  font-variation-settings:"SOFT" 45,"WONK" 1}

/* ---------- table ---------- */
.tbl{margin-top:2.5rem;width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th,.tbl td{text-align:left;padding:.85rem .8rem;border-bottom:1px solid #cfc4ae}
.tbl th{font-family:var(--mono);font-size:.62rem;letter-spacing:.15em;text-transform:uppercase;
  color:var(--burg);font-weight:500}
.tbl td:first-child{font-weight:600}
.tbl .num{font-family:var(--mono);font-size:.84rem}

/* ---------- contact ---------- */
.cta{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap;margin-top:2rem}
.cta-b{font-family:var(--mono);font-size:.68rem;letter-spacing:.13em;text-transform:uppercase;
 text-decoration:none;border:1px solid #4B443A;color:var(--wool);padding:.85rem 1.3rem;border-radius:2px}
.cta-b.primary{background:var(--blond);border-color:var(--blond);color:var(--ink);font-weight:500}
.cta-b:hover{border-color:var(--blond)}
.contact{background:var(--ink-2);text-align:center}
.contact h2{font-size:clamp(2rem,6vw,4rem);font-weight:300;margin-bottom:1.5rem;
  font-variation-settings:"SOFT" 40,"WONK" 1}
.contact .rows{display:inline-grid;gap:.5rem;text-align:left;margin-top:1.5rem}
.contact .rows div{display:grid;grid-template-columns:8rem 1fr;gap:1rem;
  border-bottom:1px solid #3b342c;padding-bottom:.5rem}
.contact .rows .k{font-family:var(--mono);font-size:.63rem;letter-spacing:.15em;
  color:var(--blond);text-transform:uppercase;padding-top:.3rem}
.foot{padding:1.6rem var(--pad);border-top:1px solid #35302a;display:flex;
  justify-content:space-between;gap:1rem;flex-wrap:wrap;color:#8d8474}

.reveal{opacity:0;transform:translateY(18px)}
.reveal.in{opacity:1;transform:none;transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
@media(prefers-reduced-motion:reduce){
  .trei line{animation:none;stroke-dashoffset:0}
  .reveal,.reveal.in{opacity:1;transform:none;transition:none}
}
:focus-visible{outline:2px solid var(--blond);outline-offset:3px}
</style>
</head>
<body>

<header class="hero">
  <div class="hero-media" aria-hidden="true">
    <!-- El src va en el propio <video>: un <source> con un tipo MIME mal
         escrito hace que el navegador descarte el archivo sin decir nada.
         Ya pasó una vez, con type="assets/mp4". -->
    <video src="assets/banner.mp4" poster="assets/banner.jpg"
           autoplay muted loop playsinline preload="metadata"></video>
    <div class="scrim"></div>
  </div>
  <button type="button" class="hero-play" id="hero-play" aria-label="Reproducir el video">
    ▶ Ver en movimiento
  </button>
  <svg class="trei" data-lattice preserveAspectRatio="none" aria-hidden="true"></svg>

  <div class="topbar">
    <div class="mark"><img class="logo" src="assets/logo.png" alt="" width="34" height="34">Casa<span>Yourte</span></div>
    <div class="lang" role="group" aria-label="Idioma / Langue">
      <button type="button" data-set="es" aria-pressed="true">Español</button>
      <button type="button" data-set="fr" aria-pressed="false">Français</button>
    </div>
  </div>

  <div class="hero-body">
    <span class="eyebrow" data-i="hero.eyebrow">Uruguay · Argentina · Brasil</span>
    <h1><span data-i="hero.t1">Yurtas que se</span> <em data-i="hero.t2">calculan.</em></h1>
    <p class="lede" style="margin-top:1.8rem" data-i="hero.lede"></p>
  </div>

  <div class="hero-meta">
    <div><span class="mono k" data-i="hero.k1"></span><span class="v" data-i="hero.v1"></span></div>
    <div><span class="mono k" data-i="hero.k2"></span><span class="v" data-i="hero.v2"></span></div>
    <div><span class="mono k" data-i="hero.k3"></span><span class="v" data-i="hero.v3"></span></div>
  </div>
</header>

<figure class="bleed" style="margin:0">
  <img data-slot="hero" src="assets/hero.jpg" alt="">
  <figcaption class="mono" data-i="cap.hero"></figcaption>
</figure>

<!-- IDEA -->
<section class="wrap idea-sec">
  <span class="eyebrow" data-i="id.eyebrow"></span>
  <h2 class="idea-h" data-i="id.title"></h2>
  <div class="idea-cols">
    <p data-i="id.b1"></p>
    <p data-i="id.b2"></p>
    <p data-i="id.b3"></p>
  </div>
  <p class="idea-k" data-i="id.k"></p>
</section>

<!-- PROCESO -->
<section class="wrap proc-sec">
  <span class="eyebrow" data-i="pr.eyebrow"></span>
  <h2 style="font-size:clamp(2rem,5.5vw,3.6rem);max-width:26ch" data-i="pr.title"></h2>
  <p class="lede" style="margin-top:1.5rem;color:#c2b9a7" data-i="pr.lede"></p>

  <figure class="proc" id="proc">
    <div class="proc-stage" id="proc-stage"></div>
    <div class="proc-bar" id="proc-bar"></div>
    <figcaption class="proc-cap">
      <span class="mono proc-n" id="proc-n"></span>
      <span class="proc-t" id="proc-t"></span>
    </figcaption>
    <div class="proc-ctl">
      <button type="button" data-act="prev" aria-label="Anterior">&lsaquo;</button>
      <button type="button" data-act="toggle" id="proc-toggle">Pausa</button>
      <button type="button" data-act="next" aria-label="Siguiente">&rsaquo;</button>
    </div>
  </figure>
</section>

<div class="band"><svg data-lattice-static preserveAspectRatio="none" aria-hidden="true"></svg></div>

/* ---------- render ---------- */
function paint(lang){
  const d=T[lang];
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(el=>{
    const v=d[el.dataset.i]; if(v===undefined) return;
    if(/<em>/.test(v)) el.innerHTML=v; else el.textContent=v;
  });
  document.querySelectorAll("[data-list]").forEach(ul=>{
    ul.innerHTML=""; (d[ul.dataset.list]||[]).forEach(t=>{
      const li=document.createElement("li"); li.textContent=t; ul.appendChild(li);
    });
  });
  document.querySelectorAll("[data-rows]").forEach(tb=>{
    tb.innerHTML=""; (d[tb.dataset.rows]||[]).forEach(r=>{
      const tr=document.createElement("tr");
      r.forEach((c,i)=>{const td=document.createElement("td");
        if(i===0||i===1) td.className="num"; td.textContent=c; tr.appendChild(td);});
      tb.appendChild(tr);
    });
  });
  document.querySelectorAll(".lang button").forEach(b=>
    b.setAttribute("aria-pressed", String(b.dataset.set===lang)));
}
document.querySelectorAll(".lang button").forEach(b=>
  b.addEventListener("click",()=>{
    paint(b.dataset.set);
    // Se refleja en la URL sin recargar: así el idioma se puede compartir
    // y los buscadores tienen una dirección propia para el francés.
    const u = new URL(location.href);
    if (b.dataset.set === "fr") u.searchParams.set("lang","fr");
    else u.searchParams.delete("lang");
    history.replaceState(null,"",u);
  }));
paint(/[?&]lang=fr/.test(location.search) ? "fr" : "es");

/* ---------- video de portada ----------
   Con autoplay muted debería arrancar solo, pero no siempre pasa: el
   ahorro de datos, el ahorro de batería o una política del navegador lo
   pueden bloquear sin avisar. Se pide la reproducción a mano, y si la
   rechazan se ofrece un botón en lugar de dejar una foto fija sin
   explicación. */
(function () {
  const v = document.querySelector(".hero-media video");
  const b = document.getElementById("hero-play");
  if (!v || !b) return;
  const menosMovimiento = matchMedia("(prefers-reduced-motion: reduce)").matches;

  function intentar() {
    const p = v.play();
    if (p && p.catch) p.catch(() => b.classList.add("on"));
  }

  b.addEventListener("click", () => {
    b.classList.remove("on");
    v.play().catch(() => b.classList.add("on"));
  });

  if (menosMovimiento) {
    // El sistema pide menos movimiento: no se arranca solo, pero se deja
    // el video a la vista y la decisión en manos del visitante.
    b.classList.add("on");
    return;
  }

  if (v.readyState >= 2) intentar();
  else v.addEventListener("loadeddata", intentar, { once: true });

  // Segundo intento con el primer toque en la página: algunos navegadores
  // sólo permiten reproducir después de una interacción.
  const reintento = () => {
    if (!v.paused) return;
    v.play().then(() => b.classList.remove("on")).catch(() => {});
  };
  addEventListener("touchstart", reintento, { once: true, passive: true });
  addEventListener("click", reintento, { once: true });
})();

/* ---------- trei lattice: two families of laths at 60° between them ---------- */
function lattice(svg,{gap=64,animate=true}={}){
  const r=svg.getBoundingClientRect();
  const W=Math.max(r.width,320), H=Math.max(r.height,120);
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const tan=Math.tan(30*Math.PI/180);   // ±30° from vertical = 60° apex
  const dx=H*tan, ns="http://www.w3.org/2000/svg";
  let i=0, frag=document.createDocumentFragment();
  for(const dir of [1,-1]){
    for(let x=-Math.abs(dx)-gap; x<W+Math.abs(dx)+gap; x+=gap){
      const x1=x, x2=x+dir*dx;
      const l=document.createElementNS(ns,"line");
      l.setAttribute("x1",x1); l.setAttribute("y1",0);
      l.setAttribute("x2",x2); l.setAttribute("y2",H);
      const len=Math.hypot(x2-x1,H);
      l.style.setProperty("--len",len);
      if(animate) l.style.setProperty("--d",(0.15+(i%26)*0.045)+"s");
      frag.appendChild(l); i++;
    }
  }
  svg.replaceChildren(frag);
}
function drawAll(){
  document.querySelectorAll("[data-lattice]").forEach(s=>lattice(s,{gap:78}));
  document.querySelectorAll("[data-lattice-static]").forEach(s=>lattice(s,{gap:46,animate:false}));
}
drawAll();
let rt; addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(drawAll,220)});

(function(){

  const imgs=[], ticks=[];
  for(let i=1;i<=N;i++){
    const im=document.createElement("img");
    im.dataset.src=SRC(i); im.alt=""; im.decoding="async";
    stage.appendChild(im); imgs.push(im);
    const t=document.createElement("i"); t.dataset.go=i-1; bar.appendChild(t); ticks.push(t);
  }
  let cur=0, timer=null, playing=true;
  function load(i){ const im=imgs[i]; if(im && !im.src && im.dataset.src) im.src=im.dataset.src; }
  function show(i){
    cur=(i+N)%N;
    imgs.forEach((im,k)=>im.classList.toggle("on",k===cur));
    ticks.forEach((t,k)=>t.classList.toggle("on",k===cur));
    document.getElementById("proc-n").textContent=String(cur+1).padStart(2,"0")+" / "+N;
    const d=T[document.documentElement.lang];
    document.getElementById("proc-t").textContent=d["pr.c"+(cur+1)]||"";
    load(cur); load((cur+1)%N); load((cur-1+N)%N);
  }
  function start(){ stop(); playing=true; timer=setInterval(()=>show(cur+1),3200);
    document.getElementById("proc-toggle").textContent="Pausa"; }
  function stop(){ if(timer) clearInterval(timer); timer=null; playing=false;
    document.getElementById("proc-toggle").textContent="Seguir"; }
  document.querySelector(".proc-ctl").addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b) return;
    const a=b.dataset.act;
    if(a==="next"){ show(cur+1); if(playing) start(); }
    if(a==="prev"){ show(cur-1); if(playing) start(); }
    if(a==="toggle"){ playing?stop():start(); }
  });
  bar.addEventListener("click",e=>{ const t=e.target.closest("i"); if(!t) return;
    show(+t.dataset.go); if(playing) start(); });
  // only run while visible, and keep captions in sync with the language toggle
  const io=new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting){ if(playing && !timer) start(); } else { if(timer){clearInterval(timer);timer=null;} }
  }),{threshold:.25});
  io.observe(document.getElementById("proc"));
  const _p=paint; paint=function(l){ _p(l); show(cur); };
  show(0);
})();

/* ---------- actualizar (sólo con ?dev=1) ----------
   Trabajar sobre el sitio publicado es incómodo porque hay tres cachés
   encima: la del navegador, la del service worker si el panel está
   instalado, y la de GitHub Pages, que sirve los archivos con unos
   minutos de vida. Este botón borra las dos primeras y recarga sin
   caché. La de GitHub no se puede forzar: si un cambio recién subido no
   aparece, hay que esperar un par de minutos. */
if (/[?&]dev=1/.test(location.search)) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = "Actualizar";
  b.style.cssText = "position:fixed;right:.8rem;bottom:.8rem;z-index:99;"
    + "font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;"
    + "background:var(--blond);color:var(--ink);border:0;border-radius:999px;"
    + "padding:.7rem 1rem;box-shadow:0 6px 24px rgba(0,0,0,.5);cursor:pointer";
  b.addEventListener("click", async () => {
    b.textContent = "Limpiando…";
    try {
      if (window.caches) {
        const claves = await caches.keys();
        await Promise.all(claves.map((k) => caches.delete(k)));
      }
    } catch (e) { /* sin cachés que borrar */ }
    const u = new URL(location.href);
    u.searchParams.set("v", Date.now());
    location.replace(u.toString());
  });
  document.body.appendChild(b);
}

/* ---------- reveal ---------- */
const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}
}),{rootMargin:"0px 0px -8% 0px"});
document.querySelectorAll(".reveal").forEach(el=>io.observe(el));
</script>
<script>
/* ─────────────────────────────────────────────────────────────
   DE DÓNDE SALE EL CONTENIDO · una sola autoridad

     1º  contenido.json del repositorio   ← ESTO manda
     2º  los textos de este mismo archivo ← respaldo si el JSON no carga

   Y nada más. El circuito es de una sola dirección:

     editar en el panel → se guarda en Firestore (para no perderlo)
       → Exportar JSON → subirlo al repositorio → cambia el sitio

   Antes esto leía Firestore primero, y era una trampa: si la base tenía
   una versión y el JSON otra, el sitio mostraba la de la base y parecía
   que el archivo subido no había servido de nada. Firestore es el
   cuaderno de trabajo; el repositorio es lo publicado.

   Excepción: con ?borrador=1 se lee el borrador de Firestore, para poder
   ver cómo quedaría ANTES de subir el JSON. Se lee por REST, en una sola
   petición y sin cargar el SDK.
   ───────────────────────────────────────────────────────────── */
(function () {
  var VER_BORRADOR = /[?&]borrador=1/.test(location.search);

  // Firestore NO admite arrays dentro de arrays, y la tabla de diámetros
  // lo es. Lo que no es texto viaja como "json:" + JSON.
  function decodificar(v) {
    if (typeof v === "string" && v.slice(0, 5) === "json:") {
      try { return JSON.parse(v.slice(5)); } catch (e) { return v; }
    }
    return v;
  }

  function aplicarTextos(d) {
    if (!d) return false;
    var hubo = false;
    ["es", "fr"].forEach(function (l) {
      if (!d[l] || typeof d[l] !== "object") return;
      Object.keys(d[l]).forEach(function (k) { T[l][k] = decodificar(d[l][k]); });
      hubo = true;
    });
    return hubo;
  }

  // Reemplazos de imagen por slot. Si la de Cloudinary no carga, vuelve la
  // del repositorio: lo esencial no depende de terceros.
  function aplicarImagenes(imgs) {
    if (!imgs) return;
    Object.keys(imgs).forEach(function (slot) {
      var im = document.querySelector('img[data-slot="' + slot + '"]');
      if (!im || !imgs[slot]) return;
      var respaldo = im.getAttribute("src");
      var ancho = slot === "hero" ? 1800 : (slot.indexOf("dif") === 0 ? 800 : 1200);
      im.addEventListener("error", function reponer() {
        im.removeEventListener("error", reponer);
        im.src = respaldo;
      });
      im.src = "https://res.cloudinary.com/kbjqcnpa/image/upload/"
             + "f_auto,q_auto,w_" + ancho + ",c_limit/" + imgs[slot];
    });
  }

  // ── nivel 1: el archivo del repositorio ──
  var cadena = fetch("contenido.json", { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw 0; return r.json(); })
    .then(function (j) {
      if (j && j.textos) aplicarTextos(j.textos);
    })
    .catch(function () { /* nivel 2: los textos de este archivo ya están puestos */ });

  // ── vista previa del borrador, sólo con ?borrador=1 ──
  if (VER_BORRADOR) {
    var REST = "https://firestore.googleapis.com/v1/projects/casayourte-mauro"
      + "/databases/(default)/documents/sitio/borrador"
      + "?key=AIzaSyDDD_xvpC4I_ec2OZymyDqVsm1K0ISTr4Q";

    function valor(v) {
      if (!v || typeof v !== "object") return undefined;
      if ("stringValue" in v) return v.stringValue;
      if ("booleanValue" in v) return v.booleanValue;
      if ("integerValue" in v) return Number(v.integerValue);
      if ("doubleValue" in v) return v.doubleValue;
      if ("nullValue" in v) return null;
      if ("arrayValue" in v) return (v.arrayValue.values || []).map(valor);
      if ("mapValue" in v) return mapa(v.mapValue.fields || {});
      return undefined;
    }
    function mapa(f) {
      var o = {};
      for (var k in f) { var x = valor(f[k]); if (x !== undefined) o[k] = x; }
      return o;
    }

    cadena = cadena
      .then(function () { return fetch(REST, { cache: "no-store" }); })
      .then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function (j) {
        var d = mapa((j && j.fields) || {});
        aplicarTextos(d);
        aplicarImagenes(d.imagenes);
        var aviso = document.createElement("div");
        aviso.textContent = "Vista previa del borrador · esto todavía no está publicado";
        aviso.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:98;"
          + "background:#7A2C3C;color:#EFE8DA;font-family:var(--mono);font-size:.6rem;"
          + "letter-spacing:.14em;text-transform:uppercase;text-align:center;padding:.5rem";
        document.body.appendChild(aviso);
      })
      .catch(function () { /* sin borrador: se queda lo del JSON */ });
  }

  cadena.then(function () { paint(document.documentElement.lang); });
})();
</script>
