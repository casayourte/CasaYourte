<!-- propuesta-8 (26-nov-2026, Mauro: «que por defecto tenga todas las capas activadas el render»): «Terminada»
     prende la estructura y TODAS las capas (algodón, freno, aislación, Tyvek y lonas), no sólo las lonas.
     propuesta-7 (18-nov-2026): el anillo del piso de listones curvados (geo-16): «Anillo del piso: listones curvados…» y la unidad «vueltas», en los cuatro idiomas.
     propuesta-6 (18-nov-2026): el chasis del vano (geo-14 / 3d-17): cabezales, tapas interiores y exteriores,
     montantes sueltos y suelos de los vanos, en la lista y en el 3D, en los cuatro idiomas.
     propuesta-5 (17-nov-2026): las piezas del sobrealto en la lista, en los cuatro idiomas.
     propuesta-4 (17-nov-2026): debajo, la LISTA DE MATERIALES del modelo, sin precios
     (`materiales()` de calculo-geo.js), en los cuatro idiomas.
     propuesta-3 (17-nov-2026): «Tapas de los montantes» en los cuatro idiomas.
     propuesta-2 (17-nov-2026): el cliente ve el 3D y un RESUMEN de lo que lleva
     (madera, placas, lona y tela, de `resumen()` de calculo-geo.js), no los
     cálculos; y cada componente del 3D se prende y apaga, en su idioma (Mauro:
     «se muestra sólo el render 3D y no todos los cálculos sino un resumen de
     cuánto se pide de madera, cuánto de lona… y la opción de dejar de
     visualizar cada uno de los componentes»).
     propuesta-1 (17-nov-2026). La propuesta para UN cliente, por link:
     propuesta.html?p=<token>. Mauro, 16-nov-2026: «un presupuesto en un link
     que yo pueda cargar y enviar para que la persona a la que le estoy
     enviando el presupuesto pueda ver la descripción detallada online… con un
     vencimiento, algo parecido a lo que pasa con el link de remate taller».

     Cómo es: el documento `entregas/{token}` lo arma la pestaña «Para el
     cliente» de calculo.html. El token es la llave: la regla deja leerlo de a
     uno, sin cuenta, sólo si está activo y no venció (REGLAS.txt), y nunca
     listar. Esta página NO carga el SDK de Firebase ni pide sesión: lo lee por
     REST con la clave web pública (la misma de album.html), arma las medidas
     con calculo-geo.js y el 3D con calculo-3d.js (three.js diferido: si el CDN
     no contesta, la página sigue y lo dice).

     No lleva costos, márgenes, proveedores ni el contacto del cliente: sólo lo
     que se escribió para él. No se indexa (noindex) y no está en el SHELL del
     service worker: siempre se lee fresca. -->

<style>
:root{

*{box-sizing:border-box}
html,body{margin:0}

h1,h2,h3{font-family:var(--disp);font-weight:500;margin:0;line-height:1.1}
header{position:sticky;top:0;z-index:10;background:rgba(24,22,20,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:.75rem var(--pad);display:flex;align-items:center;gap:.8rem}
header .mark{font-family:var(--disp);font-size:.95rem;letter-spacing:.16em;font-weight:600;color:var(--wool);
  text-decoration:none;text-transform:uppercase;display:flex;align-items:center;gap:.5rem;flex:1}
header .mark img{width:1.6rem;height:1.6rem}
header .mark span{color:var(--blond)}
.lang{display:flex;gap:.2rem}
.lang button{font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;background:none;color:var(--dim);
  border:1px solid var(--line);border-radius:3px;padding:.3rem .45rem;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--blond);color:var(--ink);border-color:var(--blond)}
main{max-width:1100px;margin:0 auto;padding:clamp(1.5rem,5vw,3rem) var(--pad) 4rem}
.eyebrow{font-family:var(--mono);font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--blond);display:block;margin-bottom:.9rem}
h1{font-size:clamp(1.9rem,6vw,3.2rem)}
.para{color:var(--dim);margin:.6rem 0 0}
.vence{display:inline-block;margin-top:.9rem;font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;
  color:var(--ink);background:var(--blond);border-radius:3px;padding:.25rem .5rem}
.v3{margin:1.6rem 0 .4rem}
.vista3d{width:100%;height:clamp(280px,58vh,620px);border:1px solid var(--line);border-radius:8px;overflow:hidden;
  touch-action:none;background:#1d1a17}
.v3-barra{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem;align-items:center}
.btn{font:inherit;font-size:.84rem;color:var(--wool);background:var(--ink-2);border:1px solid var(--line);
  border-radius:6px;padding:.45rem .75rem;cursor:pointer}
.btn[aria-pressed="true"]{border-color:var(--blond);color:var(--blond)}
.nota{color:var(--dim);font-size:.78rem;flex:1;min-width:10rem}
.partes{display:grid;grid-template-columns:repeat(auto-fill,minmax(12rem,1fr));gap:.15rem .8rem;margin-top:.5rem;
  background:var(--ink-2);border:1px solid var(--line);border-radius:8px;padding:.7rem .8rem}
.partes label{display:flex;gap:.45rem;align-items:center;font-size:.86rem;color:var(--wool);cursor:pointer;padding:.15rem 0}
.partes b{grid-column:1/-1;font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--blond);margin-top:.35rem}
.partes input{accent-color:var(--blond);width:1rem;height:1rem}
.sub{color:var(--dim);font-size:.8rem}
.mat{display:grid;gap:.4rem 1.6rem}
@media(min-width:820px){.mat{grid-template-columns:1fr 1fr}}
.mat h3{font-size:1rem;color:var(--blond);margin:.8rem 0 .2rem}
.grid{display:grid;gap:1.2rem;margin-top:2rem}
@media(min-width:820px){.grid{grid-template-columns:1fr 1.3fr}}
.caja{background:var(--ink-2);border:1px solid var(--line);border-radius:8px;padding:1.1rem 1.2rem}
.caja h2{font-size:1.25rem;margin-bottom:.7rem}
.fil{display:flex;gap:.8rem;justify-content:space-between;padding:.42rem 0;border-bottom:1px solid var(--line)}
.fil:last-child{border-bottom:0}
.fil .n{color:var(--dim);font-size:.9rem}
.fil .v{font-family:var(--mono);font-size:.88rem;text-align:right}
.desc p{margin:0 0 .8rem;max-width:68ch}
ul{margin:.2rem 0 0;padding-left:1.1rem}
li{margin:.25rem 0}
.precio{font-family:var(--disp);font-size:clamp(1.6rem,5vw,2.3rem);color:var(--blond)}
.pie{color:var(--dim);font-size:.82rem;margin-top:2rem;border-top:1px solid var(--line);padding-top:1rem}
.pie a{color:var(--blond)}
.vacio{text-align:center;padding:4rem 1rem;color:var(--dim)}
.vacio h1{color:var(--wool);margin-bottom:.8rem;font-size:clamp(1.5rem,5vw,2.2rem)}
.hide{display:none!important}

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ---------- REST (la misma lectura que album.html, más las fechas) ---------- */
function valor(v) {
  if (!v || typeof v !== "object") return undefined;
  if ("stringValue" in v) return v.stringValue;
  if ("booleanValue" in v) return v.booleanValue;
  if ("integerValue" in v) return Number(v.integerValue);
  if ("doubleValue" in v) return v.doubleValue;
  if ("timestampValue" in v) return new Date(v.timestampValue);
  if ("nullValue" in v) return null;
  if ("arrayValue" in v) return (v.arrayValue.values || []).map(valor);
  if ("mapValue" in v) return mapa(v.mapValue.fields || {});
  return undefined;
}
function mapa(f) { const o = {}; for (const k in f) { const x = valor(f[k]); if (x !== undefined) o[k] = x; } return o; }

const token = new URLSearchParams(location.search).get("p") || "";
let lang = new URLSearchParams(location.search).get("lang");
let E = null, vista = null, modo = "terminada";

function noDisponible() {
  const t = T[lang] || T.es;
  $("main").innerHTML = `<div class="vacio"><h1>${esc(t.no)}</h1><p>${esc(t.noTxt)}</p>
    <p><a class="btn" href="./">${esc(t.sitio)}</a></p></div>`;
}

async function traer() {
  if (!/^[A-Za-z0-9_-]{20,}$/.test(token)) return null;
  try {
    const r = await fetch(BASE + "entregas/" + encodeURIComponent(token) + "?key=" + CLAVE, { cache: "no-store" });
    if (!r.ok) return null;
    const j = await r.json();
    const d = mapa(j.fields || {});
    // La regla ya no deja leer uno vencido o apagado; esto es por las dudas.
    if (d.activo !== true || !(d.vence instanceof Date) || d.vence < new Date()) return null;
    return d;
  } catch { return null; }
}

function marcarIdioma() {
  document.documentElement.lang = lang;
  document.querySelectorAll("#lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.l === lang)));
}

async function pintar() {
  const t = T[lang] || T.es;
  marcarIdioma();
  if (!E) { noDisponible(); return; }
  const { calc, resumen, materiales, NOMBRES_MAT, renglonMat } = await import("./calculo-geo.js");
  const P = E.datos || {}, C = calc(P), Rs = resumen(P, C);
  const simple = P.tipo === 2, sobre = P.tono_tipo === 2;
  const nf = (v, d = 2) => new Intl.NumberFormat(lang, { minimumFractionDigits: d, maximumFractionDigits: d }).format(v);
  const fecha = new Intl.DateTimeFormat(lang, { day: "numeric", month: "long", year: "numeric" }).format(E.vence);
  // La altura al centro: lo más alto del modelo, sobre el piso terminado.
  let alto = 0;
  try {
    const { piezas3d } = await import("./calculo-3d.js");
    const K = piezas3d(P, C); let y = -Infinity;
    for (const p of K.piezas) {
      if (p.tipo === "barra") y = Math.max(y, p.a[1], p.b[1]);
      else if (p.tipo === "anillo" || p.tipo === "disco") y = Math.max(y, p.y2);
      else if (p.tipo === "malla") for (let i = 1; i < p.v.length; i += 3) y = Math.max(y, p.v[i]);
    }
    alto = y - (P.tir_alt + P.osb_sup);
  } catch {}
  const filas = [
    [t.diam, nf(P.D, 1) + " m"],
    [t.piso, nf(Math.PI * (P.D / 2) ** 2, 1) + " m²"],
    [t.muro, nf(P.alto) + " m"],
    ...(alto > 0 ? [[t.centro, "≈ " + nf(alto, 1) + " m"]] : []),
    [t.techo, simple ? t.simple : t.doble],
    [t.toono, "Ø " + nf(2 * P.r_toono) + " m · " + (sobre ? t.sobre(C.sobrealto.n_vent) : t.domo)],
    [t.aberturas, t.aberturas2(Rs.puertas, Rs.ventanas)],
  ];
  const M = Rs.madera;
  const lleva = [
    [t.madera, nf(Rs.madera_total) + " m³", `${t.m_piso} ${nf(M.piso)} · ${t.m_muro} ${nf(M.muro)} · ${t.m_techo} ${nf(M.techo)} · ${t.m_toono} ${nf(M.toono)}`],
    [t.placas, Math.round(Rs.placas) + " " + t.u_placas, ""],
    [t.lona_techo, nf(Rs.lona_techo, 1) + " m²", ""],
    [t.tela_muro, nf(Rs.tela_muro, 1) + " m²", ""],
  ];
  const parrafos = String(E.descripcion || "").split(/\n\s*\n/).map(p => p.trim()).filter(Boolean)
    .map(p => `<p>${esc(p).replace(/\n/g, "<br>")}</p>`).join("");
  const lista = (xs) => `<ul>${xs.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
  const precio = typeof E.precio === "number"
    ? new Intl.NumberFormat(lang, { style: "currency", currency: E.moneda || "USD", maximumFractionDigits: 0 }).format(E.precio) : "";
  $("main").innerHTML = `
    <span class="eyebrow">${esc(t.eyebrow)}</span>
    <h1>${esc(E.titulo || "")}</h1>
    ${E.para ? `<p class="para">${esc(t.para)} ${esc(E.para)}</p>` : ""}
    <span class="vence">${esc(t.vence)} ${esc(fecha)}</span>
    <div class="v3">
      <div class="vista3d" id="vista3d"></div>
      <div class="v3-barra">
        <button class="btn" type="button" data-modo="terminada">${esc(t.terminada)}</button>
        <button class="btn" type="button" data-modo="estructura">${esc(t.estructura)}</button>
        <button class="btn" type="button" id="partes-b">${esc(t.partes)}</button>
        <button class="btn" type="button" id="encuadrar">${esc(t.encuadrar)}</button>
        <span class="nota" id="nota3d">${esc(t.nota3d)}</span>
      </div>
      <div class="partes hide" id="partes"></div>
    </div>
    <div class="grid">
      <div class="caja"><h2>${esc(t.resumen)}</h2>
        ${filas.map(([n, v]) => `<div class="fil"><span class="n">${esc(n)}</span><span class="v">${esc(v)}</span></div>`).join("")}
        <h2 style="margin-top:1.3rem">${esc(t.lleva)}</h2>
        ${lleva.map(([n, v, d]) => `<div class="fil"><span class="n">${esc(n)}${d ? `<br><span class="sub">${esc(d)} m³</span>` : ""}</span><span class="v">${esc(v)}</span></div>`).join("")}
        ${precio ? `<h2 style="margin-top:1.3rem">${esc(t.precio)}</h2><div class="precio">${esc(precio)}</div>` : ""}
      </div>
      <div class="caja desc"><h2>${esc(t.descripcion)}</h2>${parrafos}
        ${(E.incluye || []).length ? `<h3 style="margin-top:1rem">${esc(t.incluye)}</h3>${lista(E.incluye)}` : ""}
        ${(E.no_incluye || []).length ? `<h3 style="margin-top:1rem">${esc(t.no_incluye)}</h3>${lista(E.no_incluye)}` : ""}
      </div>
    </div>
    ${(() => {
      const N = lang === "es" ? NOMBRES_MAT : { ...NOMBRES_MAT, ...(MAT_T[lang] || {}) };
      const L = materiales(P, C), grupos = [...new Set(L.map(x => x.g))];
      return `<div class="caja" style="margin-top:1.2rem"><h2>${esc(t.mat_t)}</h2><p class="sub" style="margin:-.3rem 0 .6rem">${esc(t.mat_sub)}</p>
        <div class="mat">${grupos.map(g => `<div><h3>${esc(N.grupos[g])}</h3>${L.filter(x => x.g === g).map(x => { const r = renglonMat(x, N, nf);
          return `<div class="fil"><span class="n">${esc(r.nombre)}${r.detalle ? `<br><span class="sub">${esc(r.detalle)}</span>` : ""}</span><span class="v">${esc(r.cant)}</span></div>`; }).join("")}</div>`).join("")}</div></div>`;
    })()}
    <p class="pie">${esc(t.pie(fecha))} · <a href="./">casayourte.com</a></p>`;
  document.title = (E.titulo || "Tu yurta") + " · CasaYourte";
  montar3d(P, C, t);
}

// Lo que se ve en cada modo: «terminada» con las lonas por fuera; «la
// estructura», la madera sola. Desde propuesta-2 cada componente se prende y
// apaga en la lista (sólo los que tiene ESTE modelo).
const MODOS = {
  terminada: () => true,   // propuesta-8: todas las capas, no sólo las lonas
  estructura: (k, capa) => !capa,
};
let partes = [], vis = {};
async function montar3d(P, C, t) {
  if (vista) { vista.destruir(); vista = null; }
  try {
    const { montar, PARTES, piezas3d } = await import("./calculo-3d.js");
    const hay = new Set(piezas3d(P, C).piezas.map(p => p.g));
    partes = PARTES.filter(([k]) => hay.has(k)).map(([k, nombre, capa]) => ({ k, nombre: (PARTES_T[lang] || {})[k] || nombre.replace(/ · (simple|2\.ª capa)$/, ""), capa: !!capa }));
    vis = {}; for (const [k, , capa] of PARTES) vis[k] = MODOS[modo](k, !!capa);
    pintarPartes(t);
    vista = await montar($("vista3d"), P, C, vis);
  } catch (e) {
    console.error(e);
    $("vista3d").innerHTML = `<p class="nota" style="padding:1rem">${esc(t.sin3d)}</p>`;
  }
  marcarModo();
}
function pintarPartes(t) {
  const casilla = (p) => `<label><input type="checkbox" data-parte="${p.k}" ${vis[p.k] !== false ? "checked" : ""}> ${esc(p.nombre)}</label>`;
  $("partes").innerHTML = `<b>${esc(t.estructura_t)}</b>` + partes.filter(p => !p.capa).map(casilla).join("")
    + `<b>${esc(t.capas_t)}</b>` + partes.filter(p => p.capa).map(casilla).join("")
    + `<b></b><span><button class="btn" type="button" data-todas="1">${esc(t.todas)}</button> <button class="btn" type="button" data-todas="0">${esc(t.ninguna)}</button></span>`;
}
function ver(k, on) { vis[k] = on; if (vista) vista.ver(k, on); const c = document.querySelector(`#partes [data-parte="${k}"]`); if (c) c.checked = on; }
function marcarModo() {
  const coincide = (m) => partes.length && partes.every(p => (vis[p.k] !== false) === MODOS[m](p.k, p.capa));
  document.querySelectorAll("[data-modo]").forEach(b => b.setAttribute("aria-pressed", String(coincide(b.dataset.modo))));
}

document.addEventListener("click", (ev) => {
  const l = ev.target.closest("#lang button");
  if (l) { lang = l.dataset.l; pintar(); return; }
  const m = ev.target.closest("[data-modo]");
  if (m) { modo = m.dataset.modo; for (const p of partes) ver(p.k, MODOS[modo](p.k, p.capa)); marcarModo(); return; }
  if (ev.target.closest("#partes-b")) { $("partes").classList.toggle("hide"); return; }
  const td = ev.target.closest("[data-todas]");
  if (td) { for (const p of partes) ver(p.k, td.dataset.todas === "1"); marcarModo(); return; }
  if (ev.target.closest("#encuadrar") && vista) vista.encuadrar();
});
document.addEventListener("change", (ev) => {
  const k = ev.target.dataset && ev.target.dataset.parte; if (!k) return;
  ver(k, ev.target.checked); marcarModo();
});

E = await traer();
if (!T[lang]) lang = (E && T[E.idioma]) ? E.idioma : "es";
pintar();
</script>
