<style>
:root{
  --ink:#181614; --ink-2:#242019; --ink-3:#2C2722; --line:#35302a;
  --wool:#EFE8DA; --dim:#A89E8C; --blond:#DCA96B; --burg:#7A2C3C;
  --disp:"Fraunces",Georgia,serif; --body:"Instrument Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --pad:clamp(1.25rem,5vw,5.5rem);
  --safe: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--wool);font-family:var(--body);
  font-size:16px;line-height:1.6}
h1,h2,h3{font-family:var(--disp);font-weight:500;margin:0;line-height:1.05;
  font-variation-settings:"SOFT" 22,"WONK" 1;letter-spacing:-.015em}
p{margin:0 0 1em}
a{color:inherit}
img{display:block;width:100%;height:100%;object-fit:cover}
.mono{font-family:var(--mono);font-size:.66rem;letter-spacing:.15em;text-transform:uppercase}
.hide{display:none!important}

/* ---- cabecera ---- */
header{position:sticky;top:0;z-index:20;background:rgba(24,22,20,.94);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  padding:.8rem var(--pad);display:flex;align-items:center;gap:.8rem}
header .mark{font-family:var(--disp);font-size:.95rem;letter-spacing:.16em;font-weight:600;
  display:flex;align-items:center;gap:.5rem;flex:1;text-decoration:none}
header .mark span{color:var(--blond)}
header .mark img{width:26px;height:26px;flex:none;opacity:.92}
.lang{display:flex;border:1px solid #4a4238;border-radius:999px;overflow:hidden;flex:none}
.lang button{font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;background:none;
  border:0;color:#a89e8c;padding:.42rem .7rem;cursor:pointer;text-transform:uppercase}
.lang button[aria-pressed="true"]{background:var(--blond);color:var(--ink)}

/* ---- intro ---- */
.intro{padding:clamp(2.5rem,7vw,5rem) var(--pad) clamp(1.5rem,4vw,2.5rem);max-width:1400px;margin:0 auto}
.eyebrow{font-family:var(--mono);font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--blond);display:block;margin-bottom:1.4rem}
.eyebrow::before{content:"";display:inline-block;width:1.6rem;height:1px;
  background:var(--blond);vertical-align:.32em;margin-right:.7rem}
.intro h1{font-size:clamp(2rem,6.5vw,3.6rem);font-weight:300;max-width:26ch;
  font-variation-settings:"SOFT" 40,"WONK" 1}
.intro h1 em{font-style:italic;color:var(--blond)}
.intro p{margin-top:1.3rem;max-width:52ch;color:var(--dim);font-size:1.02rem}

/* ---- álbumes ---- */
main{max-width:1400px;margin:0 auto;padding:0 var(--pad) calc(4rem + var(--safe))}
.alb{border-top:1px solid var(--line);padding:clamp(2rem,5vw,3.2rem) 0}
.alb-hd{display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap;margin-bottom:.4rem}
.alb-hd h2{font-size:clamp(1.5rem,3.6vw,2.2rem);flex:1 1 14ch}
.alb-hd .meta{font-family:var(--mono);font-size:.62rem;letter-spacing:.13em;
  text-transform:uppercase;color:var(--blond)}
.alb-sub{color:var(--dim);font-size:.9rem;margin-bottom:1.6rem}

.etapa{margin-bottom:1.8rem}
.etapa-tit{display:flex;align-items:baseline;gap:.7rem;margin-bottom:.7rem;
  padding-bottom:.35rem;border-bottom:1px solid var(--line)}
.etapa-tit b{font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--wool);flex:1;font-weight:500}
.etapa-tit span{font-family:var(--mono);font-size:.56rem;color:var(--dim)}
.etapa-desc{font-size:.9rem;line-height:1.5;color:var(--dim);max-width:60ch;
  margin:-.2rem 0 .9rem}
.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.5rem}
@media(min-width:900px){.rejilla{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.7rem}}
.foto{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--ink-2);
  border:1px solid var(--line);cursor:zoom-in;padding:0}
.foto img{transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.foto:hover img{transform:scale(1.04)}

/* La marca de lo que se mueve, sobre la miniatura. */
.foto{position:relative}
.foto .medio{position:absolute;left:.3rem;top:.3rem;font-family:var(--mono);
  font-size:.52rem;letter-spacing:.08em;background:rgba(12,10,8,.82);color:var(--wool);
  padding:.15rem .34rem;border-radius:3px;pointer-events:none}

/* ---- visor ---- */
#visor{position:fixed;inset:0;z-index:60;background:rgba(12,10,8,.96);
  display:flex;flex-direction:column;padding:0}
#visor img,#visor video{flex:1;min-height:0;width:100%;height:auto;
  object-fit:contain;background:#000}
#visor .pie{padding:.9rem var(--pad) calc(1rem + var(--safe));display:flex;gap:.8rem;
  align-items:flex-start;border-top:1px solid var(--line);background:var(--ink)}
#visor .txt{flex:1;min-width:0;font-size:.9rem;color:var(--dim);line-height:1.45}
#visor .txt b{display:block;font-family:var(--mono);font-size:.56rem;letter-spacing:.13em;
  text-transform:uppercase;color:var(--blond);margin-bottom:.25rem}
#visor .nav{display:flex;gap:.35rem;flex:none}
#visor button{font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;
  text-transform:uppercase;background:none;border:1px solid #4a4238;color:var(--wool);
  padding:.55rem .75rem;border-radius:3px;cursor:pointer;min-width:2.6rem}

.estado{text-align:center;color:var(--dim);padding:4rem 1rem;font-size:.95rem}
.volver{display:inline-flex;align-items:center;gap:.5rem;font-family:var(--mono);
  font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;
  border:1px solid #4a4238;padding:.8rem 1.2rem;border-radius:3px;margin-top:2rem}
.volver:hover{border-color:var(--blond)}
.foot{border-top:1px solid var(--line);padding:1.6rem var(--pad);max-width:1400px;
  margin:0 auto;color:#8d8474;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}

/* ---- la vista de obras ----
   Pedida por Mauro el 27-sep-2026, para el sitio limpio: cada proyecto con su
   pase de fotos automático y una descripción, y las fotos por etapa a un
   toque. Es el mismo pase de la portada —fundido, sin deslizar, porque en un
   teléfono deslizar pelea con el desplazamiento de la página— y corre sólo
   mientras está en pantalla. La elige el dato (`orden.alb_vista = "obras"`),
   así que el álbum publicado sigue siendo la rejilla de siempre. */
.obra-cuerpo{display:grid;gap:clamp(1rem,3vw,2rem);align-items:start;margin-top:1rem}
@media(min-width:860px){.obra-cuerpo{grid-template-columns:minmax(0,1.35fr) minmax(0,.65fr)}}
.pase{margin:0}
.pase-stage{position:relative;aspect-ratio:4/3;overflow:hidden;background:#0E0C0A;
  border:1px solid var(--line);cursor:zoom-in}
.pase-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity .9s ease}
.pase-stage img.on{opacity:1}
.pase-bar{display:flex;gap:2px;margin-top:.5rem}
.pase-bar i{flex:1;height:2px;background:var(--line);cursor:pointer;transition:background .3s}
.pase-bar i.on{background:var(--blond)}
.pase-pie{display:flex;gap:.7rem;align-items:baseline;margin-top:.7rem;min-height:2.6em}
.pase-et{font-family:var(--mono);font-size:.58rem;letter-spacing:.13em;text-transform:uppercase;
  color:var(--blond);flex:none;padding-top:.2rem;max-width:12ch}
.pase-cap{font-size:.88rem;color:#c2b9a7;line-height:1.45}
.pase-ctl{display:flex;gap:.4rem;margin-top:.4rem;align-items:center}
.pase-ctl button,.obra-mas{font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;
  text-transform:uppercase;background:none;border:1px solid #4a4238;color:var(--dim);
  padding:.45rem .75rem;border-radius:2px;cursor:pointer;min-width:2.6rem}
.pase-ctl button:hover,.obra-mas:hover{border-color:var(--blond);color:var(--wool)}
.pase-n{font-family:var(--mono);font-size:.58rem;letter-spacing:.12em;color:#8d8474;margin-left:auto}
@media(prefers-reduced-motion:reduce){.pase-stage img{transition:none}}
.obra-desc{font-size:1rem;color:#d6cdbb;line-height:1.6;max-width:46ch;margin:0 0 1.2rem}
.obra-desc:empty{display:none}
.obra-mas{color:var(--blond);border-color:var(--blond);padding:.7rem 1rem}
.obra-etapas{margin-top:1.6rem}
/* Dentro del editor, una descripción vacía tiene que verse para poder
   tocarla y escribirla: si no, no hay dónde apoyar el dedo. */
body.editando .obra-desc:empty{display:block;min-height:3em}
body.editando .obra-desc:empty::before{content:"Tocá para escribir de qué se trata esta obra.";
  color:#8d8474;font-style:italic}

/* ---- el taller ----
   Mismo cartel que la portada del taller: esto no es casayourte.com. */
#cy-taller{position:fixed;top:0;left:0;right:0;z-index:9999;background:#7A2C3C;
  color:#F6EFE4;font-family:var(--mono);font-size:.58rem;letter-spacing:.13em;
  text-transform:uppercase;text-align:center;padding:.45rem .8rem;line-height:1.5}
#cy-taller a{color:#fff}
body.cy-en-taller{padding-top:1.9rem}
body.cy-en-taller header{top:1.9rem}
</style>
</head>

<script src="idiomas.js?v=1"></script>
<script>
/* ═══════════════════════════════════════════════════════════════
   ÁLBUM PÚBLICO

   Lee Firestore por la API REST: dos peticiones por álbum y ninguna
   librería. Las reglas permiten lectura pública de albums y de su
   subcolección fotos, así que no hace falta sesión.

   Sólo se muestran los álbumes marcados como públicos en el panel, y
   dentro de ellos las fotos que no estén en la papelera. Nada se
   publica solo: marcar el álbum es una decisión explícita.
   ═══════════════════════════════════════════════════════════════ */

const PROYECTO = "casayourte-mauro";
const CLAVE = "AIzaSyDDD_xvpC4I_ec2OZymyDqVsm1K0ISTr4Q";
const BASE = "https://firestore.googleapis.com/v1/projects/" + PROYECTO
           + "/databases/(default)/documents/";
const CLOUD = "kbjqcnpa";

// Estos textos son el RESPALDO. Los de verdad vienen de contenido.json, con
// las claves alb.*, y se editan desde el panel como cualquier otro texto.
const T = {
  es: {
    eyebrow: "Archivo de obra",
    titulo: "Cada yurta, <em>paso a paso</em>.",
    lede: "Del taller a la yurta habitada. Las fotos van en el orden real de la construcción, agrupadas por etapa: el anillo periférico, el toono, el trei, el techo, las lonas. Es el trabajo como fue, no como queda en el catálogo.",
    cargando: "Cargando los álbumes…",
    vacio: "Todavía no hay álbumes publicados. Volvé pronto.",
    error: "No se pudieron cargar los álbumes en este momento.",
    volver: "← Volver al sitio",
    fotos: "fotos",
    sinEtapa: "otras",
    verFotos: "Ver las {n} fotos, por etapa",
    cerrarFotos: "Cerrar las fotos",
    pausa: "Pausa",
    seguir: "Seguir",
  },
  fr: {
    eyebrow: "Archives de chantier",
    titulo: "Chaque yourte, <em>étape par étape</em>.",
    lede: "De l'atelier à la yourte habitée. Les photos suivent l'ordre réel de la construction, regroupées par étape : l'anneau périphérique, le toono, le trei, le toit, les toiles. Le travail tel qu'il a été, pas tel qu'il apparaît dans un catalogue.",
    cargando: "Chargement des albums…",
    vacio: "Aucun album publié pour le moment. Revenez bientôt.",
    error: "Impossible de charger les albums pour le moment.",
    volver: "← Retour au site",
    fotos: "photos",
    sinEtapa: "autres",
    verFotos: "Voir les {n} photos, par étape",
    cerrarFotos: "Fermer les photos",
    pausa: "Pause",
    seguir: "Reprendre",
  },
  // Esto es el respaldo estático de la página, no el contenido: la autoridad
  // es Firestore y se traduce desde traducir.html. Son nueve rótulos de la
  // interfaz —no textos del sitio—, así que viven acá y no pasan por ahí.
  en: {
    eyebrow: "Build archive",
    titulo: "Every yurt, <em>step by step</em>.",
    lede: "From the workshop to the finished yurt. The photos follow the real order of the build, grouped by stage: the perimeter ring, the toono, the trei, the roof, the covers. The work as it happened, not as it looks in a catalogue.",
    cargando: "Loading albums…",
    vacio: "No albums published yet. Come back soon.",
    error: "The albums could not be loaded right now.",
    volver: "← Back to the site",
    fotos: "photos",
    sinEtapa: "other",
    verFotos: "See all {n} photos, by stage",
    cerrarFotos: "Close the photos",
    pausa: "Pause",
    seguir: "Play",
  },
};

// Las 16 etapas, en el orden de la obra. Es la misma lista del panel y del
// cálculo de horas: no se renumera.
const ETAPAS = ["01-terreno-y-apoyos","02-taller-piezas","03-plancher","04-trei",
  "05-anillo-periferico","06-toono","07-techo-triangulos","08-perchas",
  "09-lonas-y-costura","10-aislacion","11-aberturas-y-umbrales","12-skydome",
  "13-terminada-exterior","14-terminada-interior","15-equipo-y-obra","16-desmontaje"];

/* Los nombres de las 16 categorías por idioma, para los álbumes viejos que no
   tienen su propia lista. Sólo está el francés: un idioma que se sume entra
   acá cuando sus nombres pasen por la pantalla de traducción, no antes —son
   términos del oficio y no se inventan desde el código. Mientras tanto caen a
   `legible(id)`, que da el nombre en español. */
const NOMBRE_ETAPA = {
  fr: {
    "01-terreno-y-apoyos":"terrain et appuis","02-taller-piezas":"atelier · pièces",
    "03-plancher":"plancher","04-trei":"trei","05-anillo-periferico":"anneau périphérique",
    "06-toono":"toono","07-techo-triangulos":"toit · triangles","08-perchas":"perches",
    "09-lonas-y-costura":"toiles et couture","10-aislacion":"isolation",
    "11-aberturas-y-umbrales":"ouvertures et seuils","12-skydome":"skydome",
    "13-terminada-exterior":"terminée · extérieur","14-terminada-interior":"terminée · intérieur",
    "15-equipo-y-obra":"équipe et chantier","16-desmontaje":"démontage",
  },
};

/* ---------- qué idioma mostrar ----------
   Se pidió: que quien entra desde Francia o Bélgica vea el sitio en
   francés. NO se hace por IP, y no es por pereza:

     · la IP necesita preguntarle a un servicio de terceros, que es una
       petición más antes de poder pintar la página, que a veces falla y
       que se entera de quién visita el sitio;
     · y responde la pregunta equivocada. Lo que importa no es dónde está
       el aparato sino en qué idioma lee la persona. Un francés de
       vacaciones en Uruguay leería en español; un uruguayo en París,
       en francés. Los dos al revés de lo que quieren.

   Se miran dos señales que el navegador ya tiene, sin pedir nada a nadie:
     1. el idioma configurado en el teléfono;
     2. la zona horaria, que sí dice dónde está el aparato y cubre el caso
        de un teléfono en inglés dentro de Francia o Bélgica.

   Y por encima de las dos manda lo que la persona haya elegido: si tocó
   ES o FR alguna vez, eso gana siempre. Una preferencia explícita no se
   discute con una deducción.

   El orden es: lo elegido > la dirección (?lang=fr) > la deducción. */
/* La decisión de idioma vive en idiomas.js, que es la fuente única y la
   comparten esta página y album.html. Acá quedan los nombres de siempre para
   no tocar el resto del archivo. Ver la cabecera de idiomas.js. */
const idiomaDeducido = () => CY_IDIOMAS.deducido();
const idiomaElegido  = () => CY_IDIOMAS.elegido();
const recordarIdioma = (l) => CY_IDIOMAS.recordar(l);
const idiomaInicial  = () => CY_IDIOMAS.inicial();

let idioma = idiomaInicial();

/* ---------- el taller, y la vista de obras ----------
   Con ?taller=1 esta página lee sus textos de `sitio/taller`, igual que la
   portada: es la misma página leyendo otro documento, no una segunda página.
   Lleva noindex, el cartel bordó y los enlaces de vuelta al taller, porque si
   no, el botón «volver» sacaba a quien miraba la propuesta hacia el sitio
   publicado sin que se diera cuenta. Con `vista=1` es la vista previa: sin
   cartel, como la vería el público.

   La VISTA DE OBRAS la pide el dato (`orden.alb_vista = "obras"`), no la
   dirección: así el taller la prueba y el publicado sigue igual hasta que
   alguien lleve el taller al sitio. */
const EDITANDO = /[?&]edit=1/.test(location.search);
const TALLER = /[?&]taller=1/.test(location.search);
const VISTA = TALLER && /[?&]vista=1/.test(location.search);
let OBRAS = false;
let visorAbierto = false;
let pases = [];                // un pase de fotos por obra
let abiertas = {};             // qué obras tienen las fotos desplegadas
// Quien pidió menos movimiento no recibe un pase que avanza solo: arranca
// quieto y lo pone en marcha con «Seguir» si quiere.
const QUIETO = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);

// La portada a la que se vuelve: la del taller si se vino del taller.
function inicio() {
  const q = new URLSearchParams();
  if (TALLER) q.set("taller", "1");
  if (VISTA) q.set("vista", "1");
  if (idioma && idioma !== CY_IDIOMAS.fuente()) q.set("lang", idioma);
  const x = q.toString();
  return "./" + (x ? "?" + x : "");
}
function enlazarInicio() {
  document.querySelectorAll("header .mark, .foot a, #cy-taller a").forEach((a) => a.setAttribute("href", inicio()));
}
if (TALLER) {
  const m = document.createElement("meta");
  m.name = "robots"; m.content = "noindex, nofollow";
  document.head.appendChild(m);
  if (!VISTA) {
    document.body.classList.add("cy-en-taller");
    const c = document.createElement("div");
    c.id = "cy-taller";
    c.innerHTML = 'Taller · álbumes — esto NO es casayourte.com · <a href="#">volver al taller</a>';
    document.body.insertBefore(c, document.body.firstChild);
  }
}
if (EDITANDO) document.body.classList.add("editando");
let albumes = [];
let planas = [];   // todas las fotos en orden, para el visor
let iVisor = 0;

/* ---------- REST ---------- */
function valor(v) {
  if (!v || typeof v !== "object") return undefined;
  if ("stringValue" in v) return v.stringValue;
  if ("booleanValue" in v) return v.booleanValue;
  if ("integerValue" in v) return Number(v.integerValue);
  if ("doubleValue" in v) return v.doubleValue;
  if ("nullValue" in v) return null;
  if ("arrayValue" in v) return (v.arrayValue.values || []).map(valor);
  if ("mapValue" in v) return mapa(v.mapValue.fields || {});
  return undefined;
}
function mapa(f) {
  const o = {};
  for (const k in f) { const x = valor(f[k]); if (x !== undefined) o[k] = x; }
  return o;
}
const idDe = (nombre) => nombre.split("/").pop();

async function traer(ruta) {
  const r = await fetch(BASE + ruta + "?key=" + CLAVE + "&pageSize=300", { cache: "no-store" });
  if (!r.ok) throw new Error(r.status);
  const j = await r.json();
  return (j.documents || []).map((d) => ({ id: idDe(d.name), ...mapa(d.fields || {}) }));
}

/* Tres medios, tres formas de armar la URL (se guardan en 'clase'):
     foto      · imagen común
     secuencia · GIF animado, que se entrega animado sólo al abrirlo
     video     · vive en la otra punta de Cloudinary

   La miniatura SIEMPRE queda quieta, sea lo que sea. Una rejilla con
   veinte cosas moviéndose no se puede mirar y pesa como veinte videos.
   El f_jpg de la secuencia no es un descuido: un JPEG no puede animarse,
   y es la única forma segura de pedir un cuadro solo. */
const urlFoto = (pid, w) =>
  `https://res.cloudinary.com/${CLOUD}/image/upload/f_auto,q_auto,w_${w},c_limit/${pid}`;
const urlAnimada = (pid, w) =>
  `https://res.cloudinary.com/${CLOUD}/image/upload/f_auto,q_auto,w_${w},c_limit/${pid}`;
const urlVideo = (pid, w) =>
  `https://res.cloudinary.com/${CLOUD}/video/upload/f_auto,q_auto,w_${w},c_limit/${pid}.mp4`;
const urlMini = (pid, w, clase) => clase === "video"
  ? `https://res.cloudinary.com/${CLOUD}/video/upload/so_0,q_auto,w_${w},ar_4:3,c_fill/${pid}.jpg`
  : `https://res.cloudinary.com/${CLOUD}/image/upload/`
    + `${clase === "secuencia" ? "f_jpg" : "f_auto"},q_auto,w_${w},ar_4:3,c_fill,g_auto/${pid}`;

/* ---------- textos ---------- */
/* EL ÚNICO LUGAR DONDE SE LEEN LOS TEXTOS POR IDIOMA.
   Un idioma sin textos propios NO puede romper la página: se completa clave por
   clave con el idioma fuente. Es la misma decisión que ya estaba tomada para las
   etapas y las leyendas ("si falta el francés se usa el español: es mejor que un
   hueco"), que faltaba para los textos. Y es lo que permite publicar un idioma
   nuevo traducido a medias sin dejar la página en blanco. */
function textos(lang) {
  return Object.assign({}, T[CY_IDIOMAS.fuente()] || {}, T[lang] || {});
}

function pintarTextos() {
  const d = textos(idioma);
  document.documentElement.lang = idioma;
  document.querySelectorAll("[data-t]").forEach((el) => {
    const v = d[el.dataset.t];
    if (v === undefined) return;
    if (/<em>/.test(v)) el.innerHTML = v; else el.textContent = v;
  });
  document.querySelectorAll(".lang button").forEach((b) =>
    b.setAttribute("aria-pressed", String(b.dataset.set === idioma)));
  enlazarInicio();
}
// El conmutador se arma desde el catálogo, ANTES de atar los escuchadores: al
// revés se atarían a botones que después se reemplazan. Los que están escritos
// en el HTML son el respaldo para cuando el JS no corre.
CY_IDIOMAS.pintarConmutador(document.querySelector(".lang"), idioma, "corta");
CY_IDIOMAS.pintarAlternas("https://casayourte.com/album.html");

document.querySelectorAll(".lang button").forEach((b) =>
  b.addEventListener("click", () => {
    idioma = b.dataset.set;
    recordarIdioma(idioma);
    history.replaceState(null, "", CY_IDIOMAS.urlCon(new URL(location.href), idioma));
    pintarTextos(); pintar();
  }));
pintarTextos();

/* ---------- cargar ---------- */
async function cargar() {
  try {
    const todos = await traer("albums");
    const publicos = todos.filter((a) => a.publico === true);
    // Los más nuevos primero. Sin orderBy: se ordena acá, así no hace falta
    // ningún índice de Firestore.
    publicos.sort((a, b) => String(b.anio || "").localeCompare(String(a.anio || ""))
      || String(a.titulo || a.id).localeCompare(String(b.titulo || b.id), "es"));

    albumes = [];
    for (const a of publicos) {
      let fotos = [];
      try { fotos = await traer("albums/" + a.id + "/fotos"); } catch (e) { fotos = []; }
      // Se muestran sólo las fotos marcadas en el panel. 'usar' nace en falso:
      // nada se publica solo, ni el álbum ni la foto. Antes acá sólo se
      // descartaba la papelera y el tilde del panel no llegaba a decidir nada.
      fotos = fotos.filter((f) => !f.eliminada && f.usar === true && f.public_id)
                   .sort((x, y) => (x.orden || 0) - (y.orden || 0));
      if (fotos.length) albumes.push({ ...a, fotos });
    }
    // En el taller se espera a saber QUÉ vista pide el documento: si no, la
    // rejilla aparecía un instante y se cambiaba sola por la de obras.
    if (TALLER) await textosListos;
    pintar();
  } catch (e) {
    document.getElementById("main").innerHTML =
      '<p class="estado">' + textos(idioma).error + "</p>";
  }
}

/* ---------- pintar ---------- */
// La lista de categorías vive en el álbum: albums/{id}.etapas, un arreglo de
// { id, es, fr, desc_es, desc_fr } en el orden en que se muestran. Los álbumes
// que todavía no la tengan usan las 16 de siempre, con el ordenEtapas que
// tuvieran guardado. La foto guarda el id, nunca el nombre: renombrar una
// categoría no toca ninguna foto.
const legible = (id) => String(id).replace(/^\d+-/, "").replace(/-/g, " ");

function etapasDe(a) {
  if (Array.isArray(a.etapas) && a.etapas.length)
    return a.etapas.filter((e) => e && e.id);
  const guardado = Array.isArray(a.ordenEtapas) ? a.ordenEtapas : [];
  const orden = [...guardado.filter((e) => ETAPAS.includes(e)),
                 ...ETAPAS.filter((e) => !guardado.includes(e))];
  // El nombre por idioma sale de NOMBRE_ETAPA, no de un `.fr` escrito acá: si
  // mañana hay un tercer idioma con nombres propios, aparecen solos. Los que
  // no estén caen a `legible(id)` en nombreEtapa(), que es mejor que un hueco.
  return orden.map((id) => {
    const e = { id, [CY_IDIOMAS.fuente()]: legible(id) };
    Object.keys(NOMBRE_ETAPA).forEach((l) => {
      if (NOMBRE_ETAPA[l][id]) e[l] = NOMBRE_ETAPA[l][id];
    });
    return e;
  });
}

// Si falta el francés se usa el español: es mejor que un hueco.
function nombreEtapa(e) {
  return CY_IDIOMAS.enIdioma(e, idioma) || legible(e.id);
}
function descEtapa(e) {
  return CY_IDIOMAS.campo(e, "desc", idioma);
}

function pintar() {
  const main = document.getElementById("main");
  const d = textos(idioma);
  pases.forEach((p) => p.parar());
  pases = [];
  if (OBRAS) return pintarObras();
  if (!albumes.length) { main.innerHTML = '<p class="estado">' + d.vacio + "</p>"; return avisar(); }

  main.innerHTML = "";
  planas = [];

  albumes.forEach((a) => {
    const sec = document.createElement("section");
    sec.className = "alb";
    const meta = [a.anio, a.diametro, a.lugar].filter(Boolean).join(" · ");
    sec.innerHTML = `<div class="alb-hd"><h2></h2><span class="meta"></span></div>
                     <p class="alb-sub"></p>`;
    sec.querySelector("h2").textContent = a.titulo || a.id;
    sec.querySelector(".meta").textContent = meta;
    sec.querySelector(".alb-sub").textContent = a.fotos.length + " " + d.fotos;
    pintarEtapas(sec, a);
    main.appendChild(sec);
  });
  ponerVolver(main);
  avisar();
}

/* Las fotos de UN álbum, agrupadas por etapa. La usan las dos vistas: la
   rejilla de siempre y el «ver las fotos» de cada obra. Cada foto entra a la
   lista del visor en el orden en que se dibuja. */
function pintarEtapas(sec, a) {
  const d = textos(idioma);
  // Agrupado por categoría, en el orden que tenga el álbum. Las vacías no
  // aparecen, y lo que apunte a una categoría borrada cae en «otras».
  const cats = etapasDe(a);
  const ids = cats.map((e) => e.id);
  const grupos = cats.map((e) => [e, a.fotos.filter((f) => f.etapa === e.id)])
                     .filter(([, fs]) => fs.length);
  const sueltas = a.fotos.filter((f) => !ids.includes(f.etapa));
  if (sueltas.length) grupos.push([null, sueltas]);

  grupos.forEach(([etapa, fs]) => {
    const g = document.createElement("div");
    g.className = "etapa";
    g.innerHTML = `<div class="etapa-tit"><b></b><span></span></div>
                   <div class="rejilla"></div>`;
    g.querySelector("b").textContent = etapa ? nombreEtapa(etapa) : d.sinEtapa;
    g.querySelector("span").textContent = fs.length;
    const txt = etapa ? descEtapa(etapa) : "";
    if (txt) {
      const p = document.createElement("p");
      p.className = "etapa-desc";
      p.textContent = txt;
      g.insertBefore(p, g.querySelector(".rejilla"));
    }
    const rej = g.querySelector(".rejilla");
    fs.forEach((f) => {
      const k = planas.length;
      // El nombre de la etapa viaja con la foto: el visor lo recibía como un
      // id suelto, se lo pasaba a `nombreEtapa()`, que espera la etapa entera,
      // y el rótulo decía «undefined» (visto el 27-sep-2026).
      planas.push({ ...f, album: a.titulo || a.id, etapaTxt: etapa ? nombreEtapa(etapa) : d.sinEtapa });
      const b = document.createElement("button");
      b.type = "button"; b.className = "foto";
      b.innerHTML = '<img loading="lazy" decoding="async" alt="">';
      const im = b.querySelector("img");
      im.src = urlMini(f.public_id, 420, f.clase);
      im.alt = CY_IDIOMAS.campo(f, "alt", idioma);
      // Se avisa que eso se mueve ANTES de tocarlo: quien está con datos
      // contados decide si lo abre.
      if (f.clase === "video" || f.clase === "secuencia") {
        const m = document.createElement("span");
        m.className = "medio";
        m.textContent = f.clase === "video"
          ? "▶ " + (f.segundos ? f.segundos + "s" : "") : "GIF";
        b.appendChild(m);
      }
      b.addEventListener("click", () => abrirVisor(k));
      rej.appendChild(b);
    });
    sec.appendChild(g);
  });
}

function ponerVolver(main) {
  const volver = document.createElement("a");
  volver.className = "volver"; volver.href = inicio();
  volver.textContent = textos(idioma).volver;
  main.appendChild(volver);
}

/* El editor se entera cuando esta página se vuelve a dibujar: las fotos
   llegan DESPUÉS de que él escribió los textos y marcó lo que se toca, así
   que sin este aviso las descripciones de las obras no se podían editar. */
function avisar() {
  const c = window.CY_SITIO;
  if (c && typeof c.alPintar === "function") c.alPintar();
}

/* ---------- la vista de obras ---------- */
// El orden de la obra: primero la etapa, en el orden del álbum, y después el
// `orden` dentro de ella. Es el mismo orden en que `pintarEtapas` las dibuja,
// y por eso la foto N del pase es la foto N del visor.
function enOrdenDeObra(a) {
  const ids = etapasDe(a).map((e) => e.id);
  const lugar = (f) => { const i = ids.indexOf(f.etapa); return i < 0 ? ids.length : i; };
  return a.fotos.slice().sort((x, y) => lugar(x) - lugar(y) || (x.orden || 0) - (y.orden || 0));
}

const CADA = 4200;
function pintarObras() {
  const main = document.getElementById("main");
  const d = textos(idioma);
  // Un producto —la yurta mongol— no es una obra: no es un proyecto nuestro.
  const obras = albumes.filter((a) => a.tipo !== "producto");
  if (!obras.length) { main.innerHTML = '<p class="estado">' + d.vacio + "</p>"; return avisar(); }
  main.innerHTML = "";
  planas = [];

  obras.forEach((a0) => {
    const a = { ...a0, fotos: enOrdenDeObra(a0) };
    const base = planas.length;
    const sec = document.createElement("section");
    sec.className = "alb obra";
    sec.innerHTML =
      '<div class="alb-hd"><h2></h2><span class="meta"></span></div>' +
      '<div class="obra-cuerpo">' +
        '<figure class="pase">' +
          '<div class="pase-stage"></div><div class="pase-bar"></div>' +
          '<figcaption class="pase-pie"><span class="pase-et"></span><span class="pase-cap"></span></figcaption>' +
          '<div class="pase-ctl">' +
            '<button type="button" class="atras" aria-label="Anterior">&lsaquo;</button>' +
            '<button type="button" class="pausa"></button>' +
            '<button type="button" class="sigue" aria-label="Siguiente">&rsaquo;</button>' +
            '<span class="pase-n"></span>' +
          '</div>' +
        '</figure>' +
        '<div class="obra-txt"><p class="obra-desc"></p>' +
          '<button type="button" class="obra-mas"></button></div>' +
      '</div>' +
      '<div class="obra-etapas hide"></div>';
    sec.querySelector("h2").textContent = a.titulo || a.id;
    sec.querySelector(".meta").textContent = [a.anio, a.diametro, a.lugar].filter(Boolean).join(" · ");
    // La descripción es un texto del sitio, `alb.obra.<id>`: se escribe desde
    // el editor, por idioma, y no toca el álbum del panel.
    const desc = sec.querySelector(".obra-desc");
    desc.dataset.t = "obra." + a.id;
    desc.textContent = d["obra." + a.id] || "";

    // Las fotos por etapa se dibujan una vez, escondidas: así cada foto entra
    // a la lista del visor en su lugar, y el pase puede abrirla.
    const etapas = sec.querySelector(".obra-etapas");
    pintarEtapas(etapas, a);

    const stage = sec.querySelector(".pase-stage");
    const bar = sec.querySelector(".pase-bar");
    const imgs = [], ticks = [];
    a.fotos.forEach((f, i) => {
      const im = document.createElement("img");
      im.decoding = "async"; im.alt = CY_IDIOMAS.campo(f, "alt", idioma);
      im.dataset.src = urlMini(f.public_id, 1100, f.clase);   // se carga cuando le toca
      stage.appendChild(im); imgs.push(im);
      const t = document.createElement("i"); t.dataset.va = i;
      bar.appendChild(t); ticks.push(t);
    });

    const pase = {
      cur: 0, timer: null, visible: false, manual: QUIETO,
      cargar(i) { const im = imgs[i]; if (im && !im.src && im.dataset.src) im.src = im.dataset.src; },
      ver(i) {
        const n = imgs.length; if (!n) return;
        this.cur = (i + n) % n;
        this.cargar(this.cur); this.cargar((this.cur + 1) % n);
        imgs.forEach((im, k) => im.classList.toggle("on", k === this.cur));
        ticks.forEach((t, k) => t.classList.toggle("on", k === this.cur));
        const f = a.fotos[this.cur];
        const e = etapasDe(a).find((x) => x.id === f.etapa);
        sec.querySelector(".pase-et").textContent = e ? nombreEtapa(e) : d.sinEtapa;
        sec.querySelector(".pase-cap").textContent = CY_IDIOMAS.campo(f, "cap", idioma);
        sec.querySelector(".pase-n").textContent = (this.cur + 1) + "/" + n;
      },
      parar() { if (this.timer) clearInterval(this.timer); this.timer = null; },
      // Un solo lugar decide si corre: en pantalla, sin Pausa, con las fotos
      // plegadas, con el visor cerrado y fuera del editor —ahí una foto que
      // cambia abajo del dedo no se puede tocar—. El botón dice lo que eligió
      // la persona, no lo que hace el reloj.
      correr() {
        const debe = this.visible && !this.manual && !abiertas[a.id] && !visorAbierto
                  && !EDITANDO && imgs.length > 1;
        if (debe && !this.timer) this.timer = setInterval(() => this.ver(this.cur + 1), CADA);
        if (!debe) this.parar();
        sec.querySelector(".pausa").textContent = this.manual ? d.seguir : d.pausa;
      },
    };
    pases.push(pase);

    sec.querySelector(".pase-ctl").addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      if (b.classList.contains("pausa")) { pase.manual = !pase.manual; pase.correr(); return; }
      // Tomar el control con las flechas detiene el pase automático.
      pase.manual = true; pase.correr();
      pase.ver(pase.cur + (b.classList.contains("atras") ? -1 : 1));
    });
    bar.addEventListener("click", (e) => {
      const t = e.target.closest("i"); if (!t) return;
      pase.manual = true; pase.correr(); pase.ver(Number(t.dataset.va));
    });
    stage.addEventListener("click", () => { if (!EDITANDO) abrirVisor(base + pase.cur); });

    const mas = sec.querySelector(".obra-mas");
    function rotular() {
      const ab = !!abiertas[a.id];
      etapas.classList.toggle("hide", !ab);
      mas.textContent = ab ? d.cerrarFotos : String(d.verFotos).replace("{n}", a.fotos.length);
      mas.setAttribute("aria-expanded", String(ab));
      pase.correr();
    }
    mas.addEventListener("click", () => { abiertas[a.id] = !abiertas[a.id]; rotular(); });

    main.appendChild(sec);
    pase.ver(0); rotular();
    if ("IntersectionObserver" in window) {
      new IntersectionObserver((es) => es.forEach((e) => {
        pase.visible = e.isIntersecting; pase.correr();
      }), { threshold: 0.25 }).observe(stage);
    } else { pase.visible = true; pase.correr(); }
  });
  ponerVolver(main);
  avisar();
}

/* ---------- visor ---------- */
const visor = document.getElementById("visor");

function abrirVisor(i) {
  iVisor = (i + planas.length) % planas.length;
  const f = planas[iVisor];
  const img = document.getElementById("v-img");
  const vid = document.getElementById("v-video");

  // Un video NO arranca solo, y no se descarga hasta que alguien lo toca:
  // preload="none" con el cuadro quieto de cartel. Alguien que abre el
  // álbum para mirar fotos no tiene por qué gastar datos en un video que
  // no pidió.
  vid.pause();
  if (f.clase === "video") {
    img.classList.add("hide"); vid.classList.remove("hide");
    vid.poster = urlMini(f.public_id, 900, "video");
    vid.src = urlVideo(f.public_id, 1200);
  } else {
    vid.classList.add("hide"); vid.removeAttribute("src"); img.classList.remove("hide");
    // Acá sí se anima: es lo que la persona vino a ver.
    img.src = f.clase === "secuencia"
      ? urlAnimada(f.public_id, 1200) : urlFoto(f.public_id, 1600);
  }
  document.getElementById("v-etapa").textContent =
    [f.album, f.etapaTxt].filter(Boolean).join(" · ");
  document.getElementById("v-cap").textContent =
    CY_IDIOMAS.campo(f, "cap", idioma);
  if (visor.classList.contains("hide")) {
    visor.classList.remove("hide");
    visorAbierto = true; pases.forEach((p) => p.correr());
    document.body.style.overflow = "hidden";
    // El botón Atrás de Android cierra el visor en lugar de salir de la página.
    history.pushState({ visor: 1 }, "");
  }
}
function cerrarVisor(porAtras) {
  // Sin esto el video sigue sonando con el visor cerrado.
  try { document.getElementById("v-video").pause(); } catch (e) { /* no había */ }
  visor.classList.add("hide");
  visorAbierto = false; pases.forEach((p) => p.correr());
  document.body.style.overflow = "";
  if (!porAtras && history.state && history.state.visor) history.back();
}
addEventListener("popstate", () => {
  if (!visor.classList.contains("hide")) cerrarVisor(true);
});
document.getElementById("v-close").addEventListener("click", () => cerrarVisor());
document.getElementById("v-prev").addEventListener("click", () => abrirVisor(iVisor - 1));
document.getElementById("v-next").addEventListener("click", () => abrirVisor(iVisor + 1));
addEventListener("keydown", (e) => {
  if (visor.classList.contains("hide")) return;
  if (e.key === "Escape") cerrarVisor();
  if (e.key === "ArrowLeft") abrirVisor(iVisor - 1);
  if (e.key === "ArrowRight") abrirVisor(iVisor + 1);
});

/* ---------- lo que el editor puede llamar de esta página ----------
   El mismo contrato que publica la portada, con lo único que acá tiene
   sentido: esta página no tiene bloques que mover, pero sí una VISTA que
   sale de `orden` —la de obras— y se repinta cuando llegan las fotos. Con
   `?edit=1` no busca su contenido: se lo da el editor, por `aplicarOrden`. */
window.CY_SITIO = { version: 2, GRUPOS: {}, ids: () => [],
  aplicarOrden: (orden) => {
    const antes = OBRAS;
    OBRAS = !!orden && orden.alb_vista === "obras";
    if (antes !== OBRAS && albumes.length) pintar();
  },
  alPintar: null };

/* ---------- textos editables desde el panel ----------
   Se leen del mismo contenido.json que usa el sitio, con las claves alb.*.
   Si no cargan, quedan los de arriba y la página funciona igual.
   En el taller se leen de `sitio/taller`, y de ahí sale también la vista. */
let textosListos = Promise.resolve();
(function () {
  // Igual que en el index: dentro del editor no se busca el contenido.
  if (EDITANDO) return;

  function usar(d) {
    var hubo = false;
    if (d.orden && d.orden.alb_vista === "obras") { OBRAS = true; hubo = true; }
    // Todos los idiomas del catálogo, no sólo dos: un idioma nuevo traducido
    // en el taller tiene que llegar también a esta página.
    CY_IDIOMAS.ids().forEach(function (l) {
      var x = d[l] || {};
      Object.keys(x).forEach(function (k) {
        // Un idioma que todavía no existe en T se crea (ver `textos`).
        if (k.indexOf("alb.") === 0) { T[l] = T[l] || {}; T[l][k.slice(4)] = x[k]; hubo = true; }
      });
    });
    if (hubo) { pintarTextos(); if (albumes.length) pintar(); }
    return hubo;
  }

  // 1 · Firestore, que es la autoridad · 2 · el JSON del repositorio
  textosListos = fetch(BASE + "sitio/" + (TALLER ? "taller" : "publicado") + "?key=" + CLAVE, { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw 0; return r.json(); })
    .then(function (j) { if (!usar(mapa((j && j.fields) || {}))) throw 0; })
    .catch(function () {
      var MINUTO = Math.floor(Date.now() / 60000);
      return fetch("contenido.json?v=" + MINUTO, { cache: "no-store" })
        .then(function (r) { if (!r.ok) throw 0; return r.json(); })
        .then(function (j) { usar(j.textos || {}); });
    })
    .catch(function () { /* quedan los textos de respaldo de este archivo */ });
})();

cargar();
</script>
</body>
</html>
